<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LumaScale</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g1' x1='3' y1='3' x2='37' y2='37'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='0.45' stop-color='%232F80ED'/%3E%3Cstop offset='1' stop-color='%231FA85C'/%3E%3C/linearGradient%3E%3ClinearGradient id='g2' x1='14' y1='12' x2='27' y2='30'%3E%3Cstop offset='0' stop-color='%23C084FC'/%3E%3Cstop offset='1' stop-color='%23E9469E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='20' cy='20' r='16' fill='none' stroke='url(%23g1)' stroke-width='5'/%3E%3Ccircle cx='20' cy='20' r='12' fill='%23FFFFFF'/%3E%3Cpath d='M20 11.5C20 11.5 13.3 19.6 13.3 24.1A6.7 6.7 0 0 0 26.7 24.1C26.7 19.6 20 11.5 20 11.5Z' fill='url(%23g2)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #F8F8FC; --surface: #FFFFFF; --surface-2: #F1F0F7; --surface-3: #E8E6F2; --border: #E6E4EF;
    --text: #1C1D26; --text-dim: #6B6D7E; --brand: #8B5CF6; --brand-dim: #7440E8;
    --blue: #2F80ED; --yellow: #C89412; --green: #1FA85C; --red: #E5484D; --god: #E08A3F;
    --radius: 16px;
    --shadow-sm: 0 1px 3px rgba(30,20,60,0.06), 0 1px 2px rgba(30,20,60,0.05);
    --shadow-md: 0 4px 16px rgba(30,20,60,0.08);
    --shadow-lg: 0 10px 30px rgba(30,20,60,0.14);
    --font-display: 'Outfit', 'Inter', sans-serif; --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; color: var(--text); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(139,92,246,0.08), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(47,128,237,0.07), transparent 55%),
      radial-gradient(600px 380px at 50% 110%, rgba(31,168,92,0.05), transparent 55%),
      var(--bg);
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 40px; position: relative; }

  .topbar { display: flex; align-items: center; gap: 11px; padding: 20px 20px 14px; position: sticky; top: 0; background: linear-gradient(var(--bg) 75%, transparent); z-index: 20; }
  .icon-btn { background: none; border: none; color: var(--text); font-size: 19px; cursor: pointer; padding: 7px; line-height: 1; flex-shrink: 0; border-radius: 10px; transition: transform 0.15s ease, background 0.15s ease; }
  .icon-btn:active { background: var(--surface-2); transform: scale(0.9); }
  .brand-name-topbar { font-family: var(--font-display); font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
  .screen-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  main { padding: 0 20px 24px; flex: 1; }

  .role-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; }
  .role-employe { background: rgba(47,128,237,0.16); color: var(--blue); }
  .role-patron { background: rgba(139,92,246,0.18); color: var(--brand); }
  .role-god { background: rgba(224,138,63,0.18); color: var(--god); }
  .role-danger { background: rgba(229,72,77,0.16); color: var(--red); }

  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 82%; max-width: 320px;
    background: radial-gradient(120px 90px at 85% 8%, rgba(139,92,246,0.10), transparent 70%), radial-gradient(140px 100px at 90% 40%, rgba(47,128,237,0.09), transparent 70%), radial-gradient(130px 110px at 80% 78%, rgba(31,168,92,0.08), transparent 70%), var(--surface);
    border-radius: 0 34px 34px 0; z-index: 41; transform: translateX(-100%); transition: transform 0.28s cubic-bezier(.22,.9,.32,1);
    padding: 26px 18px; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 18px 0 50px rgba(120,100,170,0.18);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; padding: 0 6px; }
  .drawer-user { padding: 10px 6px 20px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .drawer-user-name { font-family: var(--font-display); font-size: 16px; margin-bottom: 6px; font-weight: 700; }
  .drawer-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); padding: 14px 10px 6px; }
  .drawer-nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 10px; color: var(--text); cursor: pointer; font-size: 14.5px; font-weight: 500; }
  .drawer-nav-item.active { background: var(--surface-2); color: var(--brand); }
  .drawer-nav-item .emoji { font-size: 17px; width: 22px; text-align: center; }
  .drawer-footer { margin-top: auto; font-size: 11.5px; color: var(--text-dim); padding: 14px 10px 4px; line-height: 1.5; white-space: pre-line; }
  .lang-switcher { display: flex; gap: 6px; margin-top: 10px; }
  .lang-pill { position: relative; overflow: hidden; flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; font-size: 12.5px; font-weight: 700; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim); cursor: pointer; }
  .lang-pill::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(233,70,158,0.55) 38%, rgba(255,255,255,0.9) 50%, rgba(47,128,237,0.55) 62%, transparent 80%);
    transform: translateX(-140%) skewX(-12deg);
  }
  .lang-pill.btn-pop::after { animation: btnShineSweep 0.7s ease-out; }
  .lang-pill.btn-pop { animation: btnBubblePress 0.4s ease-out; }
  .lang-pill.active { background: var(--brand); color: white; border-color: var(--brand); }

  input[type="text"], input[type="number"], input[type="password"], input[type="email"], textarea, select {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 15px; font-family: var(--font-body);
  }
  .password-field-wrap { position: relative; }
  .password-field-wrap input { padding-right: 46px; width: 100%; }
  .password-toggle-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-dim); padding: 6px; line-height: 1; }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .field-error { color: var(--red); font-size: 13px; margin-top: 6px; min-height: 16px; }
  .field-hint { color: var(--text-dim); font-size: 12.5px; margin-top: 6px; }
  .field-group { margin-bottom: 14px; }
  .field-label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 12px; padding: 14px 18px; font-size: 15px; font-weight: 600; font-family: var(--font-body); cursor: pointer; width: 100%; transition: transform 0.12s ease, filter 0.15s ease; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { position: relative; overflow: hidden; background: linear-gradient(135deg, #9D6BFF, #7A4CE0); color: white; box-shadow: 0 6px 18px rgba(139,92,246,0.28); }
  .btn-primary::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(233,70,158,0.55) 38%, rgba(255,255,255,0.85) 50%, rgba(47,128,237,0.55) 62%, transparent 80%);
    transform: translateX(-140%) skewX(-12deg);
  }
  .btn-primary.btn-pop::after { animation: btnShineSweep 0.7s ease-out; }
  .btn-primary.btn-pop { animation: btnBubblePress 0.4s ease-out; }
  @keyframes btnShineSweep {
    0% { transform: translateX(-140%) skewX(-12deg); }
    100% { transform: translateX(140%) skewX(-12deg); }
  }
  @keyframes btnBubblePress {
    0% { transform: scale(1); }
    35% { transform: scale(0.94); }
    65% { transform: scale(1.025); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-primary.btn-pop, .btn-primary.btn-pop::after { animation: none; }
  }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(229,72,77,0.35); }
  .btn-god { background: linear-gradient(135deg, #F6B583, #E8925A); color: #1A1200; }
  .btn-ghost { background: none; color: var(--brand); padding: 10px 0; width: auto; }
  .btn-outline-gradient {
    position: relative; color: var(--brand); font-weight: 700;
    background: linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(120deg, #8B5CF6, #2F80ED, #1FA85C) border-box;
    border: 2px solid transparent; box-shadow: 0 4px 14px rgba(139,92,246,0.14);
  }
  .btn-outline-gradient:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row > .btn { flex: 1; }
  .fab { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); max-width: 440px; width: calc(100% - 40px); z-index: 15; }
  .voice-fab {
    position: fixed; bottom: 88px; left: 50%; transform: translateX(calc(-50% + 190px));
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #9D6BFF, #7A4CE0); color: white; font-size: 22px;
    box-shadow: 0 6px 18px rgba(139,92,246,0.35); cursor: pointer; z-index: 16;
  }
  .voice-fab.listening { animation: voicePulse 1.1s ease-in-out infinite; }
  @keyframes voicePulse {
    0%, 100% { box-shadow: 0 6px 18px rgba(139,92,246,0.35), 0 0 0 0 rgba(233,70,158,0.5); }
    50% { box-shadow: 0 6px 18px rgba(139,92,246,0.35), 0 0 0 14px rgba(233,70,158,0); }
  }
  @media (max-width: 480px) {
    .voice-fab { transform: translateX(calc(-50% + 130px)); }
  }
  .wake-word-row { display: flex; justify-content: center; margin-bottom: 12px; }
  .wake-word-toggle {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
    font-size: 12.5px; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer;
  }
  .wake-word-toggle.active { background: rgba(139,92,246,0.14); color: var(--brand); border-color: rgba(139,92,246,0.35); animation: voicePulse 1.6s ease-in-out infinite; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
  .recipe-card {
    position: relative; overflow: hidden; padding-top: 22px; padding-right: 58px; border-radius: 18px;
    border-color: rgba(139,92,246,0.12);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .recipe-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: var(--recipe-accent, linear-gradient(90deg, var(--brand), #2F80ED));
  }
  .recipe-card:active { transform: scale(0.99); }
  .recipe-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .recipe-card-name { font-family: var(--font-display); font-size: 17.5px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
  .recipe-card-date { font-size: 11px; font-weight: 600; color: var(--text-dim); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .recipe-color-badge { position: absolute; top: 30px; right: 16px; width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px var(--surface), 0 4px 12px rgba(0,0,0,0.25); z-index: 2; cursor: pointer; transition: transform 0.15s ease; }
  .recipe-color-badge:active { transform: scale(0.9); }
  .hair-preview-svg { animation: hairPreviewGrow 0.5s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes hairPreviewGrow { 0% { transform: scale(0.25); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .recipe-action-row { display: flex; gap: 8px; margin-top: 16px; }
  .recipe-action-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; border: none;
    transition: transform 0.12s ease, filter 0.15s ease;
  }
  .recipe-action-btn:active { transform: scale(0.96); }
  .recipe-action-send { background: linear-gradient(135deg, rgba(139,92,246,0.16), rgba(47,128,237,0.12)); color: var(--brand); }
  .recipe-action-delete { background: rgba(229,72,77,0.08); color: var(--red); }
  .recipe-action-edit { background: var(--surface-2); color: var(--text); }
  .client-card { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .client-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
  .client-meta { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
  .empty-state { text-align: center; padding: 56px 20px; color: var(--text-dim); }
  .empty-state .big-emoji { font-size: 38px; margin-bottom: 12px; }
  .search-box { margin-bottom: 16px; }
  .tip-banner { display: flex; gap: 10px; align-items: flex-start; background: linear-gradient(135deg, rgba(139,92,246,0.14), rgba(47,128,237,0.10)); border: 1px solid rgba(139,92,246,0.25); border-radius: 12px; padding: 13px 14px; margin-bottom: 16px; font-size: 13.5px; line-height: 1.5; }
  .tip-banner .tip-close { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; }

  .bottle-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; padding: 6px 2px; }
  .bottle-item { display: flex; flex-direction: column; align-items: center; width: 64px; text-align: center; position: relative; padding-top: 6px; }
  .bottle-item svg { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12)); }
  .bottle-label { font-size: 11px; margin-top: 6px; line-height: 1.3; color: var(--text); font-weight: 600; min-height: 28px; }
  .bottle-weight { font-size: 10.5px; color: var(--text-dim); }
  .bottle-remove { position: absolute; top: -2px; right: 4px; background: var(--red); border: 2px solid var(--surface); color: white; width: 22px; height: 22px; border-radius: 50%; font-size: 14px; font-weight: 700; line-height: 1; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; }

  .new-step-card { background: var(--surface-2); border: 1px dashed var(--border); border-radius: 12px; padding: 14px; margin-top: 8px; }
  .row-2 { display: flex; gap: 10px; }
  .row-2 > * { flex: 1; }

  .status-banner { border-radius: 12px; padding: 14px 16px; font-size: 14px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .status-waiting { background: var(--surface-2); color: var(--text-dim); }
  .status-connected { background: rgba(47,128,237,0.15); color: var(--blue); }
  .status-done { background: rgba(31,168,92,0.15); color: var(--green); }
  .status-error { background: rgba(229,72,77,0.15); color: var(--red); }
  .send-step { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .send-step:last-child { border-bottom: none; }
  .send-step-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: 700; }
  .icon-pending { background: var(--surface-2); color: var(--text-dim); }
  .icon-current { background: var(--blue); color: white; animation: pulse 1.5s infinite; }
  .icon-done { background: var(--green); color: white; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(47,128,237,0.5); } 50% { box-shadow: 0 0 0 6px rgba(47,128,237,0); } }
  .send-step-text.done { color: var(--text-dim); text-decoration: line-through; }
  .note { font-size: 13px; color: var(--text-dim); line-height: 1.5; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; margin-top: 16px; border: 1px solid var(--border); }
  .device-info-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .device-info-row:last-child { border-bottom: none; }
  .device-info-row .label { color: var(--text-dim); }

  .god-header { display: flex; align-items: center; gap: 8px; background: rgba(224,138,63,0.1); border: 1px solid rgba(224,138,63,0.3); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; font-size: 13px; color: var(--god); }
  .color-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .color-row:last-child { border-bottom: none; }
  .color-row-label { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
  input[type="color"] { width: 44px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: none; padding: 2px; cursor: pointer; }
  input[type="range"] { width: 100%; accent-color: var(--god); }
  .danger-zone { border: 1px solid rgba(229,72,77,0.35); border-radius: 12px; padding: 14px; margin-top: 24px; }
  .danger-zone-title { color: var(--red); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }

  .login-wrap { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 32px 26px; position: relative; z-index: 1; }
  .login-bg-fx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .drawer-bg-fx { position: absolute !important; inset: 0; z-index: -1; }
  .login-bubble { position: absolute; bottom: -40px; border-radius: 50%; opacity: 0; filter: blur(0.5px); animation-name: loginBubbleFloat; animation-timing-function: linear; animation-iteration-count: infinite; }
  .login-icon-bubble { border-radius: 0; filter: none; line-height: 1; }
  @keyframes loginBubbleFloat {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    12% { opacity: 0.32; }
    85% { opacity: 0.22; }
    100% { transform: translateY(-110vh) scale(1.05); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .login-bg-fx { display: none; }
  }
  .login-logo { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 14px; }
  .logo3d-stage { position: relative; margin: 0 auto; perspective: 320px; }
  .logo3d-layer {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    transform-style: preserve-3d;
  }
  .logo3d-ring svg, .logo3d-core svg { display: block; }
  .logo3d-ring { filter: drop-shadow(0 6px 14px rgba(139,92,246,0.35)); animation: ringEntrance3D 1s cubic-bezier(.2,.9,.25,1) both, ringTumble3D 4.5s ease-in-out 1s infinite; }
  .logo3d-core { filter: drop-shadow(0 4px 10px rgba(233,70,158,0.30)); animation: coreEntrance3D 1s cubic-bezier(.2,.9,.25,1) both, coreTumble3D 4.5s ease-in-out 1s infinite; }
  @keyframes ringEntrance3D {
    0% { transform: rotateY(-160deg) rotateX(18deg) scale(0.5); opacity: 0; }
    65% { transform: rotateY(14deg) rotateX(-6deg) scale(1.08); opacity: 1; }
    100% { transform: rotateY(-48deg) rotateX(8deg) scale(1); opacity: 1; }
  }
  @keyframes coreEntrance3D {
    0% { transform: rotateY(160deg) rotateX(-18deg) scale(0.5); opacity: 0; }
    65% { transform: rotateY(-14deg) rotateX(6deg) scale(1.08); opacity: 1; }
    100% { transform: rotateY(48deg) rotateX(-8deg) scale(1); opacity: 1; }
  }
  @keyframes ringTumble3D {
    0%   { transform: rotateY(-48deg) rotateX(8deg); }
    50%  { transform: rotateY(48deg) rotateX(-8deg); }
    100% { transform: rotateY(-48deg) rotateX(8deg); }
  }
  @keyframes coreTumble3D {
    0%   { transform: rotateY(48deg) rotateX(-8deg); }
    50%  { transform: rotateY(-48deg) rotateX(8deg); }
    100% { transform: rotateY(48deg) rotateX(-8deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo3d-ring, .logo3d-core { animation: none; }
  }
  .login-title { font-family: var(--font-display); font-size: 30px; font-weight: 800; text-align: center; margin: 6px 0 2px; }

  function resizeImageFile(file, maxSize) {
    return new Promise((resolve, reject) => {
      if (!file.type || !file.type.startsWith("image/")) return reject(new Error("Ce fichier n'est pas une image."));
      if (file.size > MAX_UPLOAD_BYTES) return reject(new Error("Image trop volumineuse (15 Mo maximum)."));
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Image illisible."));
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxSize) { height = Math.round(height*(maxSize/width)); width = maxSize; }
          else if (height > maxSize) { width = Math.round(width*(maxSize/height)); height = maxSize; }
          const canvas = document.createElement("canvas"); canvas.width=width; canvas.height=height;
          canvas.getContext("2d").drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

      const { data: adminRow, error: adminErr } = await sb.from("platform_admins").select("id").eq("id", user.id).maybeSingle();
      if (adminErr) throw adminErr;
      if (adminRow) {
        state.isGod = true;
        state.view = "god-dashboard";
        render();
        await loadGodData();
        render();
        return;
      }

      const { data: profile, error: profErr } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
      if (profErr) throw profErr;
      if (!profile) {
        state.loginError = "Ce compte n'est rattaché à aucun salon. Contacte le support si tu penses que c'est une erreur.";
        await sb.auth.signOut();
        state.view = "login"; render();
        return;
      }
      const { data: salonCheck } = await sb.from("salons").select("active").eq("id", profile.salon_id).maybeSingle();
      if (salonCheck && salonCheck.active === false) {
        state.loginError = "L'accès de ce salon a été désactivé. Contacte le support pour plus d'informations.";
        await sb.auth.signOut();
        state.view = "login"; render();
        return;
      }
      state.profile = profile;
      state.view = "clients";
      render();
      await loadSalonData();
      render();
    } catch (e) {
      // Ne jamais échouer silencieusement : on ramène à l'écran de connexion
      // avec un message clair plutôt qu'un écran qui semble ne rien faire.
      state.loginError = "Une erreur est survenue au chargement de ton compte (" + (e.message || "erreur inconnue") + "). Réessaie, ou contacte le support si ça persiste.";
      state.view = "login";
      render();
    }
  }

  async function loadSalonData() {
    const salonId = state.profile.salon_id;
    const [{ data: salon }, { data: clients }, { data: templates }, { data: shades }, { data: volumes }] = await Promise.all([
      sb.from("salons").select("*").eq("id", salonId).maybeSingle(),
      sb.from("clients").select("*").eq("salon_id", salonId).order("created_at", { ascending: false }),
      sb.from("templates").select("*").eq("salon_id", salonId).order("created_at"),
      sb.from("shades_catalog").select("*").eq("salon_id", salonId).order("label"),
      sb.from("volumes_catalog").select("*").eq("salon_id", salonId).order("label")
    ]);
    state.salon = salon || {};
    state.clients = clients || [];
    state.templates = templates || [];
    state.shadesCatalog = shades || [];
    state.volumesCatalog = volumes || [];
    if (state.salon.theme_accent) applyThemeAccent(state.salon.theme_accent);
    await loadContentData();
  }

  async function loadContentData() {
    const [{ data: faq }, { data: changelog }] = await Promise.all([
      sb.from("faq_items").select("*").order("position"),
      sb.from("changelog_entries").select("*").order("created_at", { ascending: false })
    ]);

    state.changelogEntries = changelog || [];

  async function loadGodData() {
    const [{ data: salons }, { data: sav }, { data: codes }] = await Promise.all([
      sb.from("salons").select("*").order("created_at", { ascending: false }),
      sb.from("sav_requests").select("*, salons(name)").order("created_at", { ascending: false }).limit(50),

    ]);

  // ==========================================================================
  // 6. RENDU PRINCIPAL / ROUTEUR
  // ==========================================================================
  function render() {
    const app = document.getElementById("app");
    app.innerHTML = "";

    if (state.view === "loading") { app.appendChild(el("div", { class: "spinner-wrap" }, [el("div", { class: "spinner" })])); return; }
    if (state.view === "login") { app.appendChild(renderLogin()); return; }
    if (state.view === "signup") { app.appendChild(renderSignup()); return; }
    if (state.view === "reset-password") { app.appendChild(renderResetPassword()); return; }

    if (state.isGod) {
      app.appendChild(renderGodTopbar());
      app.appendChild(renderGodDrawer());
      const wrap = el("div", { class: "view-fade" });
      wrap.appendChild(renderGodDashboard());
      app.appendChild(wrap);
      return;
    }

    app.appendChild(renderDesktopSidebar());
    const desktopContent = el("div", { class: "desktop-content" });
    desktopContent.appendChild(renderTopbar());
    desktopContent.appendChild(renderDrawer());

    const contentWrap = el("div", { class: "view-fade" });
    const tipKey = CONTEXT_TIPS[state.view];
    const tip = tipKey ? t(tipKey) : null;
    if (tip && !state.seenTips[state.view]) {
      const banner = el("div", { class: "tip-banner" }, [el("div", { text: "💡" }), el("div", { style: "flex:1;", text: tip })]);
      const closeBtn = el("button", { class: "tip-close", text: "×" });
      closeBtn.addEventListener("click", () => { state.seenTips[state.view] = true; render(); });
      banner.appendChild(closeBtn);
      contentWrap.appendChild(el("div", { style: "padding:0 20px;" }, [banner]));
    }

    let content;
    if (state.view === "clients") content = renderClientsList();
    else if (state.view === "client") content = renderClientDetail();
    else if (state.view === "recipe-edit") content = renderRecipeEdit();
    else if (state.view === "recipe-send") content = renderRecipeSend();
    else if (state.view === "templates") content = renderTemplatesList();
    else if (state.view === "template-edit") content = renderTemplateEdit();
    else if (state.view === "balance") content = renderBalanceScreen();
    else if (state.view === "sav") content = renderSavScreen();
    else if (state.view === "settings") content = renderSettingsScreen();
    else if (state.view === "stats") content = renderStatsScreen();
    else if (state.view === "about") content = renderAboutScreen();
    contentWrap.appendChild(content);
    desktopContent.appendChild(contentWrap);

    app.appendChild(desktopContent);
  }

  // ==========================================================================
  // 7. ÉCRAN LOGIN
  // ==========================================================================
  function renderLogin() {
    const outer = el("div");
    outer.appendChild(renderLoginBgFx());
    const wrap = el("div", { class: "login-wrap" });
    const logoWrap = el("div", { class: "login-logo", style: "cursor:pointer;" }, [renderLogo3DStage(64)]);
    let logoClickCount = 0, logoClickTimer = null;
    logoWrap.addEventListener("click", () => {
      logoClickCount++;
      clearTimeout(logoClickTimer);
      logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 1800);
      if (logoClickCount >= 5) { logoClickCount = 0; clearTimeout(logoClickTimer); openQuickAdminAccessModal(); }
    });
    wrap.appendChild(logoWrap);
    wrap.appendChild(el("div", { class: "login-title-wrap" }, [el("div", { class: "login-title login-title-bubble", text: "LumaScale" })]));

    if (state.loginError) {
      wrap.appendChild(el("div", { class: "status-banner status-error" }, [el("span", { text: state.loginError })]));
      state.loginError = null;
    }

    const emailInput = el("input", { type: "email", placeholder: t("login_email") });
    const { wrap: pwdWrap, input: pwdInput } = renderPasswordField(t("login_password"));
    wrap.appendChild(el("div", { class: "field-group" }, [el("label",{class:"field-label",text:t("login_email")}), emailInput]));
    wrap.appendChild(el("div", { class: "field-group" }, [el("label",{class:"field-label",text:t("login_password")}), pwdWrap]));
    const errorEl = el("div", { class: "field-error" }); wrap.appendChild(errorEl);

    const loginBtn = el("button", { class: "btn btn-primary", text: t("login_button") });
    async function attempt() {
      errorEl.textContent = "";
      loginBtn.disabled = true;
      try {
        await doLogin(emailInput.value.trim(), pwdInput.value);
        state.view = "loading"; render();
        await loadIdentityAndData();
      } catch (e) {
        errorEl.textContent = t("login_error");
      }
      loginBtn.disabled = false;
    }
    loginBtn.addEventListener("click", attempt);
    pwdInput.addEventListener("keydown", (e) => { if (e.key === "Enter") attempt(); });
    wrap.appendChild(loginBtn);

    const forgotWrap = el("div", { class: "forgot-link" });
    const forgotBtn = el("button", { text: t("forgot_password") });
    forgotBtn.addEventListener("click", () => openForgotPasswordModal(emailInput.value.trim()));
    forgotWrap.appendChild(forgotBtn);
    wrap.appendChild(forgotWrap);

    const signupLink = el("div", { style: "text-align:center; margin-top:20px;" }, [
      el("div", { class: "field-hint", style: "margin-bottom:10px;", text: t("login_no_account") }),
      el("button", { class: "btn btn-outline-gradient", text: t("login_create_salon") })
    ]);
    signupLink.querySelector("button").addEventListener("click", () => { state.view = "signup"; render(); });
    wrap.appendChild(signupLink);

    const langSwitcher = el("div", { class: "lang-switcher", style: "margin-top:22px;" });
    LANGUAGES.forEach(l => {
      const p = el("div", { class: "lang-pill flag"+(state.language===l.code?" active":""), text: l.flag });
      p.title = l.label;
      p.addEventListener("click", () => { state.language = l.code; localStorage.setItem("lumascale_lang", l.code); setTimeout(render, 260); });
      langSwitcher.appendChild(p);
    });
    wrap.appendChild(langSwitcher);
    wrap.appendChild(renderLoginBleShortcut());
    outer.appendChild(wrap);
    return outer;
  }

  function renderLoginBleShortcut() {
    const container = el("div", { class: "login-ble-shortcut" });
    const panel = el("div", { class: "login-ble-panel" });
    panel.appendChild(el("div", { class: "login-ble-panel-label", text: "Allumage balance" }));
    const pill = el("div", { class: "login-ble-pill" });
    const onBtn = el("button", { class: "login-ble-btn on", type: "button", title: "Allumer la balance" }, [el("span", { text: "⏻ ON" })]);
    const offBtn = el("button", { class: "login-ble-btn off", type: "button", title: "Éteindre la balance" }, [el("span", { text: "⏻ OFF" })]);
    if (!navigator.bluetooth) { onBtn.disabled = true; offBtn.disabled = true; }
    onBtn.addEventListener("click", () => handleLoginBleCommand("reprendre", onBtn, offBtn, "on"));
    offBtn.addEventListener("click", () => handleLoginBleCommand("arret", onBtn, offBtn, "off"));
    pill.appendChild(onBtn); pill.appendChild(offBtn);
    panel.appendChild(pill);

    const bubble = el("button", { class: "login-ble-bubble", type: "button", title: "Raccourci balance", text: "⏻" });
    bubble.addEventListener("click", () => {
      const isOpen = panel.classList.toggle("open");
      bubble.classList.toggle("open", isOpen);
    });

    container.appendChild(panel);
    container.appendChild(bubble);
    return container;
  }

  async function handleLoginBleCommand(cmd, onBtn, offBtn, which) {
    onBtn.disabled = true; offBtn.disabled = true;
    try {
      if (!state.loginBle.commandChar) {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ name: "LumaScale" }], optionalServices: [BLE_SERVICE_UUID] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(BLE_SERVICE_UUID);
        state.loginBle.commandChar = await service.getCharacteristic(BLE_COMMAND_UUID);
        device.addEventListener("gattserverdisconnected", () => { state.loginBle.commandChar = null; });
      }
      await state.loginBle.commandChar.writeValue(new TextEncoder().encode(cmd));
      const activeBtn = which === "on" ? onBtn : offBtn;
      activeBtn.classList.add("active");
      setTimeout(() => activeBtn.classList.remove("active"), 900);
    } catch (e) {
      // Echec silencieux : ce raccourci reste discret, pas de popup d'erreur intrusive.
    }
    onBtn.disabled = !navigator.bluetooth ? true : false;
    offBtn.disabled = !navigator.bluetooth ? true : false;
  }

  function renderLoginBgFx(density) {
    const n = density || 14;
    const container = el("div", { class: "login-bg-fx" });
    const colors = ["#8B5CF6", "#2F80ED", "#1FA85C", "#E9469E"];
    const icons = ["✂️", "🧴", "🎨", "💇"];
    const iconCount = Math.max(3, Math.round(n * 0.4));
    for (let i = 0; i < n; i++) {
      const size = 6 + Math.round(Math.random() * 22);
      const left = Math.round(Math.random() * 100);
      const duration = (11 + Math.random() * 12).toFixed(1);
      const delay = (-(Math.random() * 20)).toFixed(1);
      const color = colors[i % colors.length];
      container.appendChild(el("div", { class: "login-bubble", style: `left:${left}%; width:${size}px; height:${size}px; background:${color}; animation-duration:${duration}s; animation-delay:${delay}s;` }));
    }
    for (let i = 0; i < iconCount; i++) {
      const size = 15 + Math.round(Math.random() * 11);
      const left = Math.round(Math.random() * 100);
      const duration = (13 + Math.random() * 12).toFixed(1);
      const delay = (-(Math.random() * 20)).toFixed(1);
      const icon = icons[i % icons.length];
      container.appendChild(el("div", { class: "login-bubble login-icon-bubble", style: `left:${left}%; font-size:${size}px; animation-duration:${duration}s; animation-delay:${delay}s;`, text: icon }));
    }
    return container;
  }

    openModal({
      title: "Accès rapide",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("div", { class: "field-hint", style: "margin-bottom:12px;", text: "Raccourci de dépannage — connexion directe avec un compte Administrateur." }));

        w.appendChild(pwdWrap);

  function openForgotPasswordModal(prefillEmail) {
    openModal({
      title: t("forgot_title"),
      bodyBuilder: (errEl) => {
        const w = el("div");
        w.appendChild(el("div", { class: "field-hint", style: "margin-bottom:12px;", text: t("forgot_body") }));
        w.appendChild(el("label", { class: "field-label", text: t("login_email") }));

        w.appendChild(emailIn);

  function renderResetPassword() {
    const outer = el("div");
    outer.appendChild(renderLoginBgFx());
    const wrap = el("div", { class: "login-wrap" });
    wrap.appendChild(el("div", { class: "login-logo" }, [renderLogoMark(52)]));
    wrap.appendChild(el("div", { class: "login-title", style: "font-size:24px;", text: t("reset_title") }));
    wrap.appendChild(el("div", { class: "login-subtitle", text: t("reset_subtitle") }));

    const { wrap: pwdWrap, input: pwdInput } = renderPasswordField(t("login_password"));
    const { wrap: pwd2Wrap, input: pwd2Input } = renderPasswordField(t("reset_confirm"));
    wrap.appendChild(el("div", { class: "field-group" }, [el("label",{class:"field-label",text:t("login_password")}), pwdWrap]));
    wrap.appendChild(el("div", { class: "field-group" }, [el("label",{class:"field-label",text:t("reset_confirm")}), pwd2Wrap]));
    const errorEl = el("div", { class: "field-error" }); wrap.appendChild(errorEl);

    const submitBtn = el("button", { class: "btn btn-primary", text: t("reset_submit") });
    submitBtn.addEventListener("click", async () => {
      errorEl.textContent = "";
      if (!pwdInput.value || pwdInput.value.length < 8) { errorEl.textContent = t("change_pwd_min"); return; }
      if (pwdInput.value !== pwd2Input.value) { errorEl.textContent = t("reset_mismatch"); return; }
      submitBtn.disabled = true;
      const { error } = await sb.auth.updateUser({ password: pwdInput.value });
      if (error) { errorEl.textContent = error.message; submitBtn.disabled = false; return; }
      submitBtn.textContent = t("reset_success");
      state.view = "loading"; setTimeout(() => { render(); loadIdentityAndData(); }, 900);
    });
    wrap.appendChild(submitBtn);
    outer.appendChild(wrap);
    return outer;
  }

  // ==========================================================================
  // COMMANDE VOCALE — reconnaissance et correspondance 100% locales et
  // gratuites (aucun appel serveur/IA payant). Le mot-clé "LumaScale" peut
  // être écouté en continu (voir toggleWakeWordListening) ou déclenché
  // ponctuellement via le bouton micro.

  function normalizeVoiceText(s) {
    return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s.]/g, " ").replace(/\s+/g, " ").trim();
  }
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[m][n];
  }
  function textSimilarity(a, b) {
    const maxLen = Math.max(a.length, b.length) || 1;
    return 1 - levenshtein(a, b) / maxLen;
  }
  function findBestClientMatch(normalizedText) {
    let best = null, bestScore = 0;
    (state.clients || []).forEach(c => {
      const full = normalizeVoiceText(clientDisplayName(c));
      const first = normalizeVoiceText(c.first_name || "");
      const last = normalizeVoiceText(c.last_name || "");
      let score = 0;
      if (full && normalizedText.includes(full)) score = 1;
      if (first && normalizedText.includes(first)) score = Math.max(score, 0.9);
      if (last && normalizedText.includes(last)) score = Math.max(score, 0.9);
      normalizedText.split(" ").forEach(word => {
        if (first) score = Math.max(score, textSimilarity(word, first) * 0.85);
        if (last) score = Math.max(score, textSimilarity(word, last) * 0.85);
      });
      if (score > bestScore) { bestScore = score; best = c; }
    });
    return { client: best, score: bestScore };
  }
  function findBestTemplateMatch(normalizedText) {
    let best = null, bestScore = 0;
    (state.templates || []).forEach(tpl => {
      const label = normalizeVoiceText(tpl.label);
      let score = normalizedText.includes(label) ? 1 : 0;
      const words = label.split(/[\s.]+/).filter(w => w.length > 1);
      if (words.length) {
        const hits = words.filter(w => normalizedText.includes(w)).length;
        score = Math.max(score, (hits / words.length) * 0.9);
      }
      if (score > bestScore) { bestScore = score; best = tpl; }
    });
    return { template: best, score: bestScore };
  }
  function matchVoiceCommand(rawText) {
    const text = normalizeVoiceText(rawText);
    const { client, score: clientScore } = findBestClientMatch(text);
    const { template, score: templateScore } = findBestTemplateMatch(text);
    let confidence = "basse";
    if (clientScore >= 0.75 && templateScore >= 0.6) confidence = "haute";
    else if (clientScore >= 0.5 || templateScore >= 0.4) confidence = "moyenne";
    return { client: clientScore >= 0.5 ? client : null, template: templateScore >= 0.4 ? template : null, confidence };
  }
  function detectedSpeechLang() {
    return state.language === "fr" ? "fr-FR" : (state.language === "es" ? "es-ES" : "en-US");
  }
  function handleVoiceTranscript(transcript) {
    openVoiceResultModal({ transcript, result: matchVoiceCommand(transcript) });
  }

  function startVoiceCommand() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { openVoiceResultModal({ error: t("voice_unsupported") }); return; }
    const micBtn = document.querySelector(".voice-fab");
    const recognition = new SpeechRec();
    recognition.lang = detectedSpeechLang();
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { if (micBtn) micBtn.classList.add("listening"); };
    recognition.onend = () => { if (micBtn) micBtn.classList.remove("listening"); };
    recognition.onerror = () => { if (micBtn) micBtn.classList.remove("listening"); openVoiceResultModal({ error: t("voice_mic_error") }); };
    recognition.onresult = (event) => { handleVoiceTranscript(event.results[0][0].transcript); };
    try { recognition.start(); } catch (e) { openVoiceResultModal({ error: t("voice_mic_error") }); }
  }

  // Ecoute permanente du mot-clé "LumaScale" — a activer volontairement
  // (le micro tourne en continu tant que c'est actif, ce qui a un cout
  // batterie et souleve une vraie question de vie privee : jamais actif
  // par defaut).
  function toggleWakeWordListening() {
    if (state.voice.wakeActive) {
      state.voice.wakeActive = false;
      if (state.voice.recognitionInstance) { try { state.voice.recognitionInstance.stop(); } catch(e){} state.voice.recognitionInstance = null; }
      render();
      return;
    }
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { openVoiceResultModal({ error: t("voice_unsupported") }); return; }
    state.voice.wakeActive = true;
    render();
    startWakeListener();
  }
  function startWakeListener() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRec();
    recognition.lang = detectedSpeechLang();
    recognition.continuous = true;
    recognition.interimResults = false;
    state.voice.recognitionInstance = recognition;
    recognition.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        const norm = normalizeVoiceText(transcript);
        const key = norm.includes("lumascale") ? "lumascale" : (norm.includes("luma scale") ? "luma scale" : null);
        if (key) {
          const idx = norm.indexOf(key) + key.length;
          handleVoiceTranscript(transcript.slice(idx).trim() || transcript);
        }
      }
    };
    recognition.onend = () => { if (state.voice.wakeActive) { try { recognition.start(); } catch(e){} } };
    recognition.onerror = () => { if (state.voice.wakeActive) setTimeout(() => { try { recognition.start(); } catch(e){} }, 600); };
    try { recognition.start(); } catch(e) {}
  }

  function resetBleState() {
    state.ble = { device:null, server:null, recipeChar:null, statusChar:null, commandChar:null, configChar:null, infoChar:null,
      connected:false, statusText:"", error:null, currentStepIndex:-1, validatedSteps:[], finished:false, serial:null, firmwareVersion:null,
      batteryPercent:null, charging:false, ecoMode:false, pollTimer:null,

  function renderRecipeSend() {
    const recipe = state.currentRecipe;
    if (!recipe) { state.view="clients"; setTimeout(render,0); return el("div",{class:"empty-state",text:t("recipe_no_selection")}); }
    const main = el("main");
    let bannerClass="status-waiting", bannerText=t("recipe_send_no_balance");
    if (state.ble.error) { bannerClass="status-error"; bannerText=state.ble.error; }
    else if (state.ble.finished) { bannerClass="status-done"; bannerText=t("recipe_send_done"); }
    else if (state.ble.connected) { bannerClass="status-connected"; bannerText=state.ble.statusText||"Connectée"; }
    main.appendChild(el("div", { class: `status-banner ${bannerClass}`, text: bannerText }));
    if (!navigator.bluetooth) main.appendChild(el("div",{class:"note",text:t("recipe_send_bluetooth_note")}));
    const stepsCard = el("div", { class: "card" });
    recipe.steps.forEach((step,i) => {
      let iconClass="icon-pending", iconContent=String(i+1), textClass="";
      if (state.ble.validatedSteps.includes(i)) { iconClass="icon-done"; iconContent="✓"; textClass="done"; }
      else if (state.ble.currentStepIndex===i) iconClass="icon-current";
      stepsCard.appendChild(el("div", { class: "send-step" }, [
        el("div", { class: `send-step-icon ${iconClass}`, text: iconContent }),
        el("div", { class: "step-text" }, [el("div",{class:`step-label ${textClass}`,text:step.label}), el("div",{class:"step-weight",text:`${step.weight} g`})])
      ]));
    });
    main.appendChild(stepsCard);
    if (!state.ble.connected) {
      const btn = el("button", { class: "btn btn-primary", style: "margin-top:16px;", text: t("recipe_send_connect") });
      if (!navigator.bluetooth) btn.disabled = true;
      btn.addEventListener("click", () => connectAndSend(recipe)); main.appendChild(btn);
    } else if (!state.ble.finished) {
      const btn = el("button", { class: "btn btn-danger", style: "margin-top:16px;", text: t("recipe_send_cancel") });
      btn.addEventListener("click", cancelRecipe); main.appendChild(btn);
    } else {
      const btn = el("button", { class: "btn btn-secondary", style: "margin-top:16px;", text: t("recipe_send_back") });
      btn.addEventListener("click", () => { disconnectBle(); state.view="client"; render(); }); main.appendChild(btn);
    }
    return main;
  }
  async function connectAndSend(recipe) {
    try {
      state.ble.error = null; state.ble.statusText = "Recherche de la balance..."; render();
      const device = await navigator.bluetooth.requestDevice({ filters: [{ name: "LumaScale" }], optionalServices: [BLE_SERVICE_UUID] });
      state.ble.device = device; device.addEventListener("gattserverdisconnected", onBleDisconnected);
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(BLE_SERVICE_UUID);
      state.ble.recipeChar = await service.getCharacteristic(BLE_RECIPE_UUID);
      state.ble.statusChar = await service.getCharacteristic(BLE_STATUS_UUID);
      state.ble.commandChar = await service.getCharacteristic(BLE_COMMAND_UUID);
      state.ble.configChar = await service.getCharacteristic(BLE_CONFIG_UUID).catch(()=>null);
      state.ble.infoChar = await service.getCharacteristic(BLE_INFO_UUID).catch(()=>null);
      await state.ble.statusChar.startNotifications();
      state.ble.statusChar.addEventListener("characteristicvaluechanged", onStatusNotification);
      const payload = recipe.steps.map(s => ({ nom: s.label, poids: s.weight, type: s.type }));
      await state.ble.recipeChar.writeValue(new TextEncoder().encode(JSON.stringify(payload)));
      state.ble.connected = true; state.ble.currentStepIndex = 0; state.ble.validatedSteps = [];
      state.ble.statusText = "Recette envoyée — en attente sur la balance"; render();
    } catch (err) { state.ble.error = tr("recipe_send_error", { msg: err.message||"erreur inconnue" }); render(); }
  }
  function onStatusNotification(event) {
    const value = new TextDecoder().decode(event.target.value);
    if (value.startsWith("etape_validee:")) { const idx=parseInt(value.split(":")[1],10); if (!state.ble.validatedSteps.includes(idx)) state.ble.validatedSteps.push(idx); state.ble.statusText=`Étape ${idx+1} validée ✓`; }
    else if (value.startsWith("etape_suivante:")) { const p=value.split(":"); state.ble.currentStepIndex=parseInt(p[1],10); state.ble.statusText=`En cours : ${p[2]||""}`; }
    else if (value==="recette_terminee") { state.ble.finished=true; state.ble.statusText="Recette terminée"; }
    else if (value==="recette_annulee") { state.ble.finished=false; state.ble.connected=false; state.ble.statusText="Recette annulée"; }
    render();
  }
  function onBleDisconnected() { stopBleInfoPolling(); if (!state.ble.finished) state.ble.statusText = "Téléphone déconnecté — la balance continue seule."; render(); }
  function cancelRecipe() { if (state.ble.commandChar) state.ble.commandChar.writeValue(new TextEncoder().encode("annuler")).catch(()=>{}); state.ble.connected=false; state.ble.statusText="Recette annulée"; render(); }
  function disconnectBle() { stopBleInfoPolling(); try { if (state.ble.device && state.ble.device.gatt.connected) state.ble.device.gatt.disconnect(); } catch(e){} }

  function renderBatteryIcon(percent, charging) {
    const p = percent === null || percent === undefined ? 0 : Math.max(0, Math.min(100, percent));
    let fillColor = "var(--green)";
    if (p < 20) fillColor = "var(--red)"; else if (p < 45) fillColor = "var(--yellow)";
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 46 24"); svg.setAttribute("width", "46"); svg.setAttribute("height", "24");
    const innerW = 36, fillW = Math.round((p / 100) * innerW);
    svg.innerHTML = `<rect x="1" y="1" width="40" height="22" rx="5" fill="none" stroke="var(--text-dim)" stroke-width="2"/><rect x="42" y="8" width="3" height="8" rx="1.5" fill="var(--text-dim)"/><rect x="4" y="4" width="${innerW}" height="16" rx="2.5" fill="var(--surface-2)"/><rect x="4" y="4" width="${fillW}" height="16" rx="2.5" fill="${fillColor}"/>` +
      (charging ? `<path d="M24 4 L16 13 H21 L18 20 L27 10 H22 Z" fill="white" stroke="${fillColor}" stroke-width="0.6"/>` : "");
    return svg;
  }

  async function connectStandalone() {
    try {
      state.ble.error = null; render();
      const device = await navigator.bluetooth.requestDevice({ filters: [{ name: "LumaScale" }], optionalServices: [BLE_SERVICE_UUID] });
      state.ble.device = device; device.addEventListener("gattserverdisconnected", onBleDisconnected);
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(BLE_SERVICE_UUID);
      state.ble.commandChar = await service.getCharacteristic(BLE_COMMAND_UUID);
      state.ble.configChar = await service.getCharacteristic(BLE_CONFIG_UUID).catch(()=>null);
      state.ble.infoChar = await service.getCharacteristic(BLE_INFO_UUID).catch(()=>null);
      await refreshBleInfo();
      state.ble.connected = true; render();
      startBleInfoPolling();
    } catch (err) { state.ble.error = "Connexion impossible : " + (err.message||"erreur inconnue"); render(); }
  }
  async function refreshBleInfo() {
    if (!state.ble.infoChar) return;
    try {
      const v = await state.ble.infoChar.readValue();
      const info = JSON.parse(new TextDecoder().decode(v));
      state.ble.serial = info.serial; state.ble.firmwareVersion = info.firmware;
      state.ble.batteryPercent = typeof info.battery === "number" ? info.battery : null;
      state.ble.charging = !!info.charging;
      state.ble.ecoMode = !!info.eco_mode;
      state.ble.wifiConfigured = !!info.wifi_configured;
      state.ble.wifiConnected = !!info.wifi_connected;
      state.ble.lastError = info.last_error || "";
      if (state.salon && !state.salon.scale_serial && info.serial) { await sb.from("salons").update({ scale_serial: info.serial }).eq("id", state.salon.id); state.salon.scale_serial = info.serial; }
    } catch(e) {}
  }
  function startBleInfoPolling() {
    stopBleInfoPolling();
    state.ble.pollTimer = setInterval(async () => {
      if (!state.ble.connected) { stopBleInfoPolling(); return; }
      await refreshBleInfo();
      if (state.view === "balance") render();
    }, 20000);
  }
  function stopBleInfoPolling() {
    if (state.ble.pollTimer) { clearInterval(state.ble.pollTimer); state.ble.pollTimer = null; }
  }
  async function sendCommand(cmd) {
    if (!state.ble.commandChar) return;
    try { await state.ble.commandChar.writeValue(new TextEncoder().encode(cmd)); }
    catch (e) { state.ble.error = "Échec de l'envoi."; render(); }
  }

    </style></head><body>
      <h1>Rapport statistiques — ${salonName}</h1>
      <div class="meta">Généré le ${dateStr} avec LumaScale</div>

        <div class="kpi"><div class="num">${stats.totalRecipes}</div><div class="lbl">RECETTES CRÉÉES</div></div>

  function printStatsReport(stats) {

  function exportStatsReport(stats) {
    const html = buildStatsReportHtml(stats);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateSlug = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `statistiques-lumascale-${dateSlug}.html`;
    document.body.appendChild(a); a.click(); a.remove();

  async function loadStatsData() {
    const { data: recipes } = await sb.from("recipes").select("label, steps").eq("salon_id", state.profile.salon_id);
    const list = recipes || [];
    const recipeCounts = {};
    const productTotals = {};
    list.forEach(r => {
      recipeCounts[r.label] = (recipeCounts[r.label] || 0) + 1;
      (r.steps || []).forEach(s => {
        if (!productTotals[s.label]) productTotals[s.label] = { weight: 0, type: s.type };
        productTotals[s.label].weight += Number(s.weight) || 0;
      });
    });
    const topRecipes = Object.entries(recipeCounts).map(([label, count]) => ({ label, count })).sort((a,b) => b.count - a.count).slice(0, 5);
    const topProducts = Object.entries(productTotals).map(([label, v]) => ({ label, weight: Math.round(v.weight), type: v.type })).sort((a,b) => b.weight - a.weight).slice(0, 6);
    const colorationOnly = Object.entries(productTotals).filter(([_, v]) => v.type === "coloration").map(([label, v]) => ({ label, weight: Math.round(v.weight) }));
    const topShade = colorationOnly.sort((a,b) => b.weight - a.weight)[0] || null;
    return { totalRecipes: list.length, totalClients: state.clients.length, topRecipes, topProducts, topShade };
  }

        w.appendChild(el("label",{class:"field-label",style:"margin-top:12px;",text:t("add_employee_password")})); w.appendChild(el("input",{type:"password",id:"newPwd"}));
        w.appendChild(el("label",{class:"field-label",style:"margin-top:12px;",text:t("add_employee_role")}));
        const sel = el("select",{id:"newRole"}); sel.appendChild(el("option",{value:"employe",text:ROLE_LABELS.employe})); sel.appendChild(el("option",{value:"patron",text:ROLE_LABELS.patron})); w.appendChild(sel);
        return w;
      },
      confirmLabel: t("add_employee_create"),
      onConfirm: async () => {
        const username = document.getElementById("newUsername").value.trim();
        const email = document.getElementById("newEmail").value.trim();
        const password = document.getElementById("newPwd").value;
        const role = document.getElementById("newRole").value;
        if (!username || !email || !password) { document.querySelector(".field-error").textContent = t("add_employee_required"); return false; }
        const { data: { session } } = await sb.auth.getSession();
        try {
          const res = await fetch(`${FUNCTIONS_URL}/create-employee`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}` },
            body: JSON.stringify({ username, email, password, role })
          });
          const json = await res.json();
          if (!res.ok) { document.querySelector(".field-error").textContent = json.error || t("signup_unknown_error"); return false; }
          render();
        } catch (e) { document.querySelector(".field-error").textContent = t("add_employee_server_error"); return false; }
      }
    });
  }
  function renderCatalogManager({ titleKey, catalog, table, placeholderKey, defaultColor }) {
    const wrap = el("div");
    wrap.appendChild(el("div", { class: "field-label", style: "margin:20px 0 8px;", text: t(titleKey) }));
    const card = el("div", { class: "card" });
    catalog.forEach(item => {
      const row = el("div", { class: "color-row" });
      const labelInput = el("input", { type: "text", style: "flex:1;" }); labelInput.value = item.label;
      labelInput.addEventListener("change", async () => { await sb.from(table).update({ label: labelInput.value.trim() }).eq("id", item.id); item.label = labelInput.value.trim(); });
      const colorInput = el("input", { type: "color" }); colorInput.value = item.color;
      colorInput.addEventListener("change", async (e) => { await sb.from(table).update({ color: e.target.value }).eq("id", item.id); item.color = e.target.value; });
      const delBtn = el("button", { class: "step-remove", text: "🗑", style:"background:none;border:none;font-size:18px;cursor:pointer;" });
      delBtn.addEventListener("click", () => {
        if (catalog.length<=1) { confirmDialog(t("catalog_min_one"), ()=>{}, "btn-danger"); return; }
        confirmDialog(tr("catalog_delete_confirm", { label: item.label }), async () => {
          await sb.from(table).delete().eq("id", item.id);
          const idx = catalog.indexOf(item); if (idx>=0) catalog.splice(idx,1);
          render();
        }, "btn-danger");
      });
      row.appendChild(labelInput); row.appendChild(colorInput); row.appendChild(delBtn); card.appendChild(row);
    });
    const addRow = el("div", { class: "new-step-card" });
    const newLabel = el("input", { type: "text", placeholder: t(placeholderKey) }); const newColor = el("input", { type: "color" }); newColor.value = defaultColor;
    addRow.appendChild(newLabel); addRow.appendChild(el("div",{style:"margin-top:10px;"},[newColor]));
    const addBtn = el("button", { class: "btn btn-secondary", style: "margin-top:10px;", text: t("catalog_add") });
    addBtn.addEventListener("click", async () => {
      const label = newLabel.value.trim(); if (!label) return;
      const { data, error } = await sb.from(table).insert({ salon_id: state.profile.salon_id, label, color: newColor.value }).select().single();
      if (!error) { catalog.push(data); render(); }
    });
    addRow.appendChild(addBtn); card.appendChild(addRow); wrap.appendChild(card); return wrap;
  }

  // ==========================================================================
  // 18. TABLEAU DE BORD GOD (séparé, hors app salon)

  function renderGodDashboard() {
    const main = el("main");
    main.appendChild(el("div", { class: "god-header" }, [el("span",{text:"🛠️"}), el("span",{text:"Accès éditeur — traverse tous les salons."})]));

    const genCard = el("div", { class: "card" });
    const serialInput = el("input", { type: "text", placeholder: "Numéro de série de la balance (ex : LS-4F3A21)" });
    genCard.appendChild(el("div", { class: "field-group" }, [el("label",{class:"field-label",text:"Numéro de série"}), serialInput]));
    const genBtn = el("button", { class: "btn btn-god", text: "Générer un code" });
    genBtn.addEventListener("click", async () => {
      const code = "LUMA-" + Math.random().toString(36).slice(2,6).toUpperCase() + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
      const { data, error } = await sb.from("activation_codes").insert({ code, scale_serial: serialInput.value.trim() || null }).select().single();
      if (!error) { state.god.codes.unshift(data); render(); }
    });
    genCard.appendChild(genBtn); main.appendChild(genCard);

    main.appendChild(el("div", { class: "field-label", style: "margin:20px 0 8px;", text: `CODES (${state.god.codes.length})` }));

    if (state.god.codes.length === 0) codesCard.appendChild(el("div", { class: "client-meta", text: "Aucun code généré." }));

      codesCard.appendChild(el("div", { class: "device-info-row" }, [
        el("span", { text: c.code }),

      ]));

    const salonsCard = el("div", { class: "card" });
    if (state.god.salons.length === 0) salonsCard.appendChild(el("div", { class: "client-meta", text: "Aucun salon inscrit pour l'instant." }));
    state.god.salons.forEach(s => {
      const row = el("div", { class: "device-info-row" }, [
        el("div", {}, [
          el("div", { text: s.name || "(sans nom)" }),
          el("span", { class: "client-meta", text: s.scale_serial || "—" }),
          !s.active ? el("span", { class: "role-badge role-danger", style: "margin-left:8px;", text: "DÉSACTIVÉ" }) : null
        ])
      ]);
      const delBtn = el("button", { class: "step-remove", text: "🗑", style: "background:none;border:none;font-size:18px;cursor:pointer;" });
      delBtn.addEventListener("click", () => confirmDialog(`Supprimer définitivement le salon "${s.name}" et toutes ses données (clients, recettes...) ?`, async () => {
        await sb.from("salons").delete().eq("id", s.id);
        state.god.salons = state.god.salons.filter(x => x.id !== s.id);
        render();
      }, "btn-danger"));
      row.appendChild(delBtn);
      salonsCard.appendChild(row);
    });
    main.appendChild(salonsCard);

    main.appendChild(el("div", { class: "field-label", style: "margin:20px 0 8px;", text: `DEMANDES SAV (${state.god.savRequests.length})` }));

    const CATEGORY_LABELS_GOD = { panne: "Panne matérielle", bluetooth: "Bluetooth", app: "Application", facturation: "Facturation", resiliation: "⚠️ RÉSILIATION", autre: "Autre" };
    state.god.savRequests.forEach(r => {

        el("div", { style: "margin-top:8px; font-size:13.5px;", text: r.message }),
        el("span", { class: `role-badge ${r.status==='closed'?'role-employe':'role-god'}`, style:"margin-top:10px; display:inline-block; margin-left:6px;", text: r.status })
      ]);
      if (r.status !== "closed") {
        const btnRow = el("div", { class: "btn-row", style: "margin-top:10px;" });
        const closeBtn = el("button", { class: "btn btn-secondary", text: "Marquer comme traité" });
        closeBtn.addEventListener("click", async () => { await sb.from("sav_requests").update({ status: "closed" }).eq("id", r.id); r.status = "closed"; render(); });
        btnRow.appendChild(closeBtn);
        if (isCancellation && r.salons) {
          const cancelSalonBtn = el("button", { class: "btn btn-danger", text: "Résilier ce salon" });
          cancelSalonBtn.addEventListener("click", () => confirmDialog(`Désactiver l'accès du salon "${r.salons.name}" ? Le compte ne pourra plus se connecter.`, async () => {
            await sb.from("sav_requests").update({ status: "closed" }).eq("id", r.id);
            const salonRow = state.god.salons.find(s => s.name === r.salons.name);
            if (salonRow) { await sb.from("salons").update({ active: false }).eq("id", salonRow.id); salonRow.active = false; }
            r.status = "closed"; render();
          }, "btn-danger"));

    // --- Gestion de la FAQ (contenu affiché dans le SAV de tous les salons) ---
    main.appendChild(el("div", { class: "field-label", style: "margin:26px 0 8px;", text: `FAQ (${state.faqItems.length})` }));
    const faqCard = el("div", { class: "card" });
    faqCard.appendChild(el("div", { class: "field-hint", style: "margin-bottom:10px;", text: "Visible par tous les salons dans leur écran SAV." }));
    state.faqItems.forEach(item => {
      const row = el("div", { style: "padding:10px 0; border-bottom:1px solid var(--border);" });
      row.appendChild(el("div", { style: "font-weight:600; margin-bottom:4px;", text: item.question }));
      row.appendChild(el("div", { class: "client-meta", text: (item.steps||[]).map(s => s.text).join(" · ") }));
      const btnRow = el("div", { class: "btn-row", style: "margin-top:8px;" });
      const editBtn = el("button", { class: "btn btn-secondary", text: "Modifier" });
      editBtn.addEventListener("click", () => openFaqEditModal(item));
      const delBtn = el("button", { class: "btn btn-danger", text: "Supprimer" });
      delBtn.addEventListener("click", () => confirmDialog(`Supprimer cette question ?`, async () => {
        await sb.from("faq_items").delete().eq("id", item.id);
        state.faqItems = state.faqItems.filter(f => f.id !== item.id);
        render();
      }, "btn-danger"));
      btnRow.appendChild(editBtn); btnRow.appendChild(delBtn); row.appendChild(btnRow);
      faqCard.appendChild(row);
    });
    const addFaqBtn = el("button", { class: "btn btn-god", style: "margin-top:12px;", text: "+ Ajouter une question" });
    addFaqBtn.addEventListener("click", () => openFaqEditModal(null));
    faqCard.appendChild(addFaqBtn);
    main.appendChild(faqCard);

    // --- Gestion des mises à jour (historique affiché dans l'écran "Mises à jour") ---
    main.appendChild(el("div", { class: "field-label", style: "margin:26px 0 8px;", text: `MISES À JOUR (${state.changelogEntries.length})` }));
    const clCard = el("div", { class: "card" });
    clCard.appendChild(el("div", { class: "field-hint", style: "margin-bottom:10px;", text: "Visible par tous les salons dans leur écran Mises à jour." }));
    state.changelogEntries.forEach(entry => {
      const row = el("div", { style: "padding:10px 0; border-bottom:1px solid var(--border);" });
      row.appendChild(el("div", { style: "font-weight:600;", text: `Version ${entry.version} — ${entry.release_date}` }));
      row.appendChild(el("div", { class: "client-meta", text: (entry.changes||[]).join(" · ") }));
      const delBtn = el("button", { class: "btn btn-danger", style: "margin-top:8px;", text: "Supprimer" });
      delBtn.addEventListener("click", () => confirmDialog(`Supprimer la version ${entry.version} ?`, async () => {
        await sb.from("changelog_entries").delete().eq("id", entry.id);
        state.changelogEntries = state.changelogEntries.filter(c => c.id !== entry.id);
        render();
      }, "btn-danger"));
      row.appendChild(delBtn);
      clCard.appendChild(row);
    });
    const addClBtn = el("button", { class: "btn btn-god", style: "margin-top:12px;", text: "+ Ajouter une version" });
    addClBtn.addEventListener("click", openChangelogAddModal);
    clCard.appendChild(addClBtn);
    main.appendChild(clCard);

    return main;
  }

  function openFaqEditModal(existingItem) {
    openModal({
      title: existingItem ? "Modifier la question" : "Nouvelle question FAQ",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("label", { class: "field-label", text: "Question (avec emoji si tu veux)" }));
        const qInput = el("input", { type: "text", id: "faqQuestion" }); qInput.value = existingItem ? existingItem.question : "";
        w.appendChild(qInput);
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Étapes — une par ligne, format : emoji | texte" }));
        const stepsText = existingItem ? (existingItem.steps||[]).map(s => `${s.icon} | ${s.text}`).join("\n") : "";
        const stepsArea = el("textarea", { id: "faqSteps", style: "min-height:120px;" }); stepsArea.value = stepsText;
        w.appendChild(stepsArea);
        return w;
      },
      confirmLabel: "Enregistrer",
      onConfirm: async () => {
        const question = document.getElementById("faqQuestion").value.trim();
        const rawSteps = document.getElementById("faqSteps").value.trim();
        if (!question || !rawSteps) { document.querySelector(".field-error").textContent = "Question et au moins une étape requises."; return false; }
        const steps = rawSteps.split("\n").filter(l => l.trim()).map(line => {
          const parts = line.split("|");
          return { icon: (parts[0]||"💡").trim(), text: (parts.slice(1).join("|")||line).trim() };
        });
        if (existingItem) {
          const { error } = await sb.from("faq_items").update({ question, steps }).eq("id", existingItem.id);
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          existingItem.question = question; existingItem.steps = steps;
        } else {
          const { data, error } = await sb.from("faq_items").insert({ question, steps, position: state.faqItems.length + 1 }).select().single();
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          state.faqItems.push(data);
        }
        render();
      }
    });
  }

  function openChangelogAddModal() {
    openModal({
      title: "Nouvelle version",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("label", { class: "field-label", text: "Numéro de version" }));
        w.appendChild(el("input", { type: "text", id: "clVersion", placeholder: "Ex : 2.1.0" }));
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Date (libre)" }));
        const dateInput = el("input", { type: "text", id: "clDate", placeholder: "Ex : Octobre 2026" }); dateInput.value = new Date().getFullYear().toString();
        w.appendChild(dateInput);
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Changements — un par ligne" }));
        w.appendChild(el("textarea", { id: "clChanges", style: "min-height:120px;" }));
        return w;
      },
      confirmLabel: "Enregistrer",
      onConfirm: async () => {
        const version = document.getElementById("clVersion").value.trim();
        const release_date = document.getElementById("clDate").value.trim();
        const changes = document.getElementById("clChanges").value.trim().split("\n").filter(l => l.trim());
        if (!version || changes.length === 0) { document.querySelector(".field-error").textContent = "Version et au moins un changement requis."; return false; }
        const { data, error } = await sb.from("changelog_entries").insert({ version, release_date, changes }).select().single();
        if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
        state.changelogEntries.unshift(data);
        render();
      }
    });
  }

  // ==========================================================================
  // 19. DÉMARRAGE
  // ==========================================================================
  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") { state.view = "login"; render(); }
    else if (event === "PASSWORD_RECOVERY") { state.view = "reset-password"; render(); }
  });

  // Effet de reflet + rebond au clic, appliqué automatiquement à tous les
  // boutons violets (.btn-primary) sans avoir à modifier chacun d'eux.
  document.addEventListener("click", (e) => {
    const btn = e.target.closest && e.target.closest(".btn-primary, .lang-pill");
    if (!btn) return;
    btn.classList.remove("btn-pop");
    void btn.offsetWidth; // force le redémarrage de l'animation si reclic rapide
    btn.classList.add("btn-pop");
    btn.addEventListener("animationend", () => btn.classList.remove("btn-pop"), { once: true });
  }, true);

  async function init() {
    render();
    const { data: { session } } = await sb.auth.getSession();
    if (session) { state.session = session; await loadIdentityAndData(); }
    else { state.view = "login"; render(); }
  }
  init();
})();
