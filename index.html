<style>

  function resizeImageFile(file, maxSize) {
    return new Promise((resolve, reject) => {
      if (!file.type || !file.type.startsWith("image/")) return reject(new Error("Ce fichier n'est pas une image."));
      if (file.size > MAX_UPLOAD_BYTES) return reject(new Error("Image trop volumineuse (15 Mo maximum)."));
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Image illisible."));
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxSize) { height = Math.round(height*(maxSize/width)); width = maxSize; }
          else if (height > maxSize) { width = Math.round(width*(maxSize/height)); height = maxSize; }

        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

      if (profErr) throw profErr;
      if (!profile) {
        state.loginError = "Ce compte n'est rattaché à aucun salon. Contacte le support si tu penses que c'est une erreur.";
        await sb.auth.signOut();
        state.view = "login"; render();
        return;
      }
      const { data: salonCheck } = await sb.from("salons").select("active").eq("id", profile.salon_id).maybeSingle();
      if (salonCheck && salonCheck.active === false) {
        state.loginError = "L'accès de ce salon a été désactivé. Contacte le support pour plus d'informations.";
        await sb.auth.signOut();
        state.view = "login"; render();
        return;
      }
      state.profile = profile;
      state.view = "clients";
      render();
      await loadSalonData();
      render();
    } catch (e) {
      // Ne jamais échouer silencieusement : on ramène à l'écran de connexion
      // avec un message clair plutôt qu'un écran qui semble ne rien faire.
      state.loginError = "Une erreur est survenue au chargement de ton compte (" + (e.message || "erreur inconnue") + "). Réessaie, ou contacte le support si ça persiste.";
      state.view = "login";
      render();
    }
  }

  function getTablePk(tableName) { return TABLE_PK[tableName] || "id"; }

  async function loadAndRenderTable(tableName, container) {
    container.innerHTML = "Chargement…";
    const { data, error } = await sb.from(tableName).select("*").limit(200);
    container.innerHTML = "";
    if (error) { container.appendChild(el("div", { class: "field-error", text: error.message })); return; }
    renderTableGrid(tableName, data || [], container);
  }

  function renderTableGrid(tableName, rows, container) {
    container.innerHTML = "";
    const pk = getTablePk(tableName);
    const columns = rows.length ? Object.keys(rows[0]) : (TABLE_COLUMNS_FALLBACK[tableName] || [pk]);
    const errorLine = el("div", { class: "field-error" });
    const scrollWrap = el("div", { style: "overflow-x:auto;" });
    const table = el("table", { style: "border-collapse:collapse; width:100%; font-size:12px;" });
    const thead = el("tr");
    columns.forEach(c => thead.appendChild(el("th", { style: "text-align:left; padding:6px; border-bottom:2px solid var(--border); white-space:nowrap; color:var(--text-dim);", text: c })));
    thead.appendChild(el("th", { text: "" }));
    table.appendChild(thead);

    function buildRow(row, isNew) {
      const tr = el("tr");
      const inputs = {};
      columns.forEach(c => {
        const td = el("td", { style: "padding:4px; border-bottom:1px solid var(--border); vertical-align:top;" });
        const readOnly = !isNew && (c === pk || c === "created_at");
        const val = row ? row[c] : null;
        const isObj = val !== null && typeof val === "object";
        const input = isObj ? el("textarea", { style: "width:170px; min-height:50px; font-size:11px;" }) : el("input", { type: "text", style: "width:130px; font-size:11px;" });
        if (val !== undefined) input.value = isObj ? JSON.stringify(val) : (val === null ? "" : String(val));
        if (readOnly) input.disabled = true;
        inputs[c] = input;
        td.appendChild(input);
        tr.appendChild(td);
      });
      const actionsTd = el("td", { style: "padding:4px; white-space:nowrap;" });
      function collectValues() {
        const payload = {};
        columns.forEach(c => {
          if (!isNew && (c === pk || c === "created_at")) return;
          const raw = inputs[c].value;
          const original = row ? row[c] : null;
          if (raw === "") {
            // Ligne existante : vider un champ = le mettre a NULL explicitement.
            // Nouvelle ligne : ne rien envoyer du tout, pour laisser les
            // valeurs par defaut de la table s'appliquer (id auto, date de
            // creation, statut par defaut...) au lieu de forcer un NULL qui
            // ferait echouer la creation sur les colonnes obligatoires.
            if (!isNew) payload[c] = null;
            return;
          }
          if ((original !== null && typeof original === "object") || (isNew && (raw.trim().startsWith("{") || raw.trim().startsWith("[")))) {
            try { payload[c] = JSON.parse(raw); } catch (e) { payload[c] = raw; }
          } else if (typeof original === "boolean" || raw === "true" || raw === "false") { payload[c] = raw === "true"; }
          else if (typeof original === "number") { payload[c] = Number(raw); }
          else { payload[c] = raw; }
        });
        return payload;
      }
      if (isNew) {
        const createBtn = el("button", { class: "step-remove", text: "➕", title: "Créer", style: "background:none;border:none;cursor:pointer;font-size:15px;" });
        createBtn.addEventListener("click", async () => {
          errorLine.textContent = "";
          const { error } = await sb.from(tableName).insert(collectValues());
          if (error) { errorLine.textContent = error.message; return; }
          logAdminAction(`Ligne créée (${tableName})`, "");
          loadAndRenderTable(tableName, container);
        });
        actionsTd.appendChild(createBtn);
      } else {
        const saveBtn = el("button", { class: "step-remove", text: "💾", title: "Enregistrer", style: "background:none;border:none;cursor:pointer;font-size:14px;" });
        saveBtn.addEventListener("click", async () => {
          errorLine.textContent = "";
          const { error } = await sb.from(tableName).update(collectValues()).eq(pk, row[pk]);
          if (error) { errorLine.textContent = error.message; return; }
          logAdminAction(`Ligne modifiée (${tableName})`, String(row[pk]));
          saveBtn.textContent = "✅"; setTimeout(() => saveBtn.textContent = "💾", 1200);
        });
        const delBtn = el("button", { class: "step-remove", text: "🗑", title: "Supprimer", style: "background:none;border:none;cursor:pointer;font-size:14px;" });
        delBtn.addEventListener("click", () => confirmDialog(`Supprimer définitivement cette ligne de "${tableName}" ?`, async () => {
          const { error } = await sb.from(tableName).delete().eq(pk, row[pk]);
          if (error) { errorLine.textContent = error.message; return; }
          logAdminAction(`Ligne supprimée (${tableName})`, String(row[pk]));
          tr.remove();
        }, "btn-danger"));
        actionsTd.appendChild(saveBtn); actionsTd.appendChild(delBtn);
      }
      tr.appendChild(actionsTd);
      return tr;
    }

    rows.forEach(row => table.appendChild(buildRow(row, false)));
    scrollWrap.appendChild(table);
    container.appendChild(scrollWrap);
    container.appendChild(errorLine);
    const addRowBtn = el("button", { class: "btn btn-secondary", style: "margin-top:10px;", text: "+ Ajouter une ligne vierge" });
    addRowBtn.addEventListener("click", () => {
      const newRowTable = el("table", { style: "border-collapse:collapse; width:100%; font-size:12px; margin-top:8px;" });
      newRowTable.appendChild(buildRow(null, true));
      container.insertBefore(newRowTable, addRowBtn);
    });
    container.appendChild(addRowBtn);
  }

  // ==========================================================================
  // 6. RENDU PRINCIPAL / ROUTEUR
  // ==========================================================================
  function render() {
    const app = document.getElementById("app");
    app.innerHTML = "";

    if (state.view === "loading") { app.appendChild(el("div", { class: "spinner-wrap" }, [el("div", { class: "spinner" })])); return; }
    if (state.view === "login") { app.appendChild(renderLogin()); return; }
    if (state.view === "signup") { app.appendChild(renderSignup()); return; }
    if (state.view === "reset-password") { app.appendChild(renderResetPassword()); return; }

    if (state.isGod) {
      app.appendChild(renderGodTopbar());
      app.appendChild(renderGodDrawer());
      const wrap = el("div", { class: "view-fade" });
      wrap.appendChild(renderGodDashboard());
      app.appendChild(wrap);
      return;
    }

    app.appendChild(renderDesktopSidebar());
    const desktopContent = el("div", { class: "desktop-content" });
    desktopContent.appendChild(renderTopbar());
    desktopContent.appendChild(renderDrawer());

    const contentWrap = el("div", { class: "view-fade" });
    const tipKey = CONTEXT_TIPS[state.view];
    const tip = tipKey ? t(tipKey) : null;
    if (tip && !state.seenTips[state.view]) {
      const banner = el("div", { class: "tip-banner" }, [el("div", { text: "💡" }), el("div", { style: "flex:1;", text: tip })]);
      const closeBtn = el("button", { class: "tip-close", text: "×" });
      closeBtn.addEventListener("click", () => { state.seenTips[state.view] = true; render(); });
      banner.appendChild(closeBtn);
      contentWrap.appendChild(el("div", { style: "padding:0 20px;" }, [banner]));
    }

    let content;
    if (state.view === "clients") content = renderClientsList();
    else if (state.view === "client") content = renderClientDetail();
    else if (state.view === "recipe-edit") content = renderRecipeEdit();
    else if (state.view === "recipe-send") content = renderRecipeSend();
    else if (state.view === "templates") content = renderTemplatesList();
    else if (state.view === "template-edit") content = renderTemplateEdit();
    else if (state.view === "balance") content = renderBalanceScreen();
    else if (state.view === "sav") content = renderSavScreen();
    else if (state.view === "settings") content = renderSettingsScreen();
    else if (state.view === "stats") content = renderStatsScreen();
    else if (state.view === "about") content = renderAboutScreen();
    contentWrap.appendChild(content);
    desktopContent.appendChild(contentWrap);

    app.appendChild(desktopContent);
  }

  async function handleLoginBleCommand(cmd, onBtn, offBtn, which) {
    onBtn.disabled = true; offBtn.disabled = true;
    try {
      if (!state.loginBle.commandChar) {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ name: "LumaScale" }], optionalServices: [BLE_SERVICE_UUID] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(BLE_SERVICE_UUID);
        state.loginBle.commandChar = await service.getCharacteristic(BLE_COMMAND_UUID);
        device.addEventListener("gattserverdisconnected", () => { state.loginBle.commandChar = null; });
      }
      await state.loginBle.commandChar.writeValue(new TextEncoder().encode(cmd));
      const activeBtn = which === "on" ? onBtn : offBtn;
      activeBtn.classList.add("active");
      setTimeout(() => activeBtn.classList.remove("active"), 900);
    } catch (e) {
      // Echec silencieux : ce raccourci reste discret, pas de popup d'erreur intrusive.
    }
    onBtn.disabled = !navigator.bluetooth ? true : false;
    offBtn.disabled = !navigator.bluetooth ? true : false;
  }

  // ==========================================================================
  // COMMANDE VOCALE — reconnaissance et correspondance 100% locales et
  // gratuites (aucun appel serveur/IA payant). Le mot-clé "LumaScale" peut
  // être écouté en continu (voir toggleWakeWordListening) ou déclenché
  // ponctuellement via le bouton micro.
  // ==========================================================================
  function normalizeVoiceText(s) {
    return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s.]/g, " ").replace(/\s+/g, " ").trim();
  }
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[m][n];
  }
  function textSimilarity(a, b) {
    const maxLen = Math.max(a.length, b.length) || 1;
    return 1 - levenshtein(a, b) / maxLen;
  }
  function findBestClientMatch(normalizedText) {
    let best = null, bestScore = 0;
    (state.clients || []).forEach(c => {
      const full = normalizeVoiceText(clientDisplayName(c));
      const first = normalizeVoiceText(c.first_name || "");
      const last = normalizeVoiceText(c.last_name || "");
      let score = 0;
      if (full && normalizedText.includes(full)) score = 1;
      if (first && normalizedText.includes(first)) score = Math.max(score, 0.9);
      if (last && normalizedText.includes(last)) score = Math.max(score, 0.9);
      normalizedText.split(" ").forEach(word => {
        if (first) score = Math.max(score, textSimilarity(word, first) * 0.85);
        if (last) score = Math.max(score, textSimilarity(word, last) * 0.85);
      });
      if (score > bestScore) { bestScore = score; best = c; }
    });
    return { client: best, score: bestScore };
  }
  function findBestTemplateMatch(normalizedText) {
    let best = null, bestScore = 0;
    (state.templates || []).forEach(tpl => {
      const label = normalizeVoiceText(tpl.label);
      let score = normalizedText.includes(label) ? 1 : 0;
      const words = label.split(/[\s.]+/).filter(w => w.length > 1);
      if (words.length) {
        const hits = words.filter(w => normalizedText.includes(w)).length;
        score = Math.max(score, (hits / words.length) * 0.9);
      }
      if (score > bestScore) { bestScore = score; best = tpl; }
    });
    return { template: best, score: bestScore };
  }
  function matchVoiceCommand(rawText) {
    const text = normalizeVoiceText(rawText);
    const { client, score: clientScore } = findBestClientMatch(text);
    const { template, score: templateScore } = findBestTemplateMatch(text);
    let confidence = "basse";
    if (clientScore >= 0.75 && templateScore >= 0.6) confidence = "haute";
    else if (clientScore >= 0.5 || templateScore >= 0.4) confidence = "moyenne";
    return { client: clientScore >= 0.5 ? client : null, template: templateScore >= 0.4 ? template : null, confidence };
  }
  function detectedSpeechLang() {
    return state.language === "fr" ? "fr-FR" : (state.language === "es" ? "es-ES" : "en-US");
  }
  function handleVoiceTranscript(transcript) {
    openVoiceResultModal({ transcript, result: matchVoiceCommand(transcript) });
  }

  function startVoiceCommand() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { openVoiceResultModal({ error: t("voice_unsupported") }); return; }
    const micBtn = document.querySelector(".voice-fab");
    const recognition = new SpeechRec();
    recognition.lang = detectedSpeechLang();
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { if (micBtn) micBtn.classList.add("listening"); };
    recognition.onend = () => { if (micBtn) micBtn.classList.remove("listening"); };
    recognition.onerror = () => { if (micBtn) micBtn.classList.remove("listening"); openVoiceResultModal({ error: t("voice_mic_error") }); };
    recognition.onresult = (event) => { handleVoiceTranscript(event.results[0][0].transcript); };
    try { recognition.start(); } catch (e) { openVoiceResultModal({ error: t("voice_mic_error") }); }
  }

  // Ecoute permanente du mot-clé "LumaScale" — a activer volontairement
  // (le micro tourne en continu tant que c'est actif, ce qui a un cout
  // batterie et souleve une vraie question de vie privee : jamais actif
  // par defaut).
  function toggleWakeWordListening() {
    if (state.voice.wakeActive) {
      state.voice.wakeActive = false;
      if (state.voice.recognitionInstance) { try { state.voice.recognitionInstance.stop(); } catch(e){} state.voice.recognitionInstance = null; }
      render();
      return;
    }
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { openVoiceResultModal({ error: t("voice_unsupported") }); return; }
    state.voice.wakeActive = true;
    render();
    startWakeListener();
  }
  function startWakeListener() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRec();
    recognition.lang = detectedSpeechLang();
    recognition.continuous = true;
    recognition.interimResults = false;
    state.voice.recognitionInstance = recognition;
    recognition.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        const norm = normalizeVoiceText(transcript);
        const key = norm.includes("lumascale") ? "lumascale" : (norm.includes("luma scale") ? "luma scale" : null);
        if (key) {
          const idx = norm.indexOf(key) + key.length;
          handleVoiceTranscript(transcript.slice(idx).trim() || transcript);
        }
      }
    };
    recognition.onend = () => { if (state.voice.wakeActive) { try { recognition.start(); } catch(e){} } };
    recognition.onerror = () => { if (state.voice.wakeActive) setTimeout(() => { try { recognition.start(); } catch(e){} }, 600); };
    try { recognition.start(); } catch(e) {}
  }

  function resetBleState() {
    state.ble = { device:null, server:null, recipeChar:null, statusChar:null, commandChar:null, configChar:null, infoChar:null,
      connected:false, statusText:"", error:null, currentStepIndex:-1, validatedSteps:[], finished:false, serial:null, firmwareVersion:null,

  function renderRecipeSend() {
    const recipe = state.currentRecipe;
    if (!recipe) { state.view="clients"; setTimeout(render,0); return el("div",{class:"empty-state",text:t("recipe_no_selection")}); }
    const main = el("main");
    let bannerClass="status-waiting", bannerText=t("recipe_send_no_balance");
    if (state.ble.error) { bannerClass="status-error"; bannerText=state.ble.error; }
    else if (state.ble.finished) { bannerClass="status-done"; bannerText=t("recipe_send_done"); }
    else if (state.ble.connected) { bannerClass="status-connected"; bannerText=state.ble.statusText||"Connectée"; }
    main.appendChild(el("div", { class: `status-banner ${bannerClass}`, text: bannerText }));
    if (!navigator.bluetooth) main.appendChild(el("div",{class:"note",text:t("recipe_send_bluetooth_note")}));
    const stepsCard = el("div", { class: "card" });
    recipe.steps.forEach((step,i) => {
      let iconClass="icon-pending", iconContent=String(i+1), textClass="";
      if (state.ble.validatedSteps.includes(i)) { iconClass="icon-done"; iconContent="✓"; textClass="done"; }
      else if (state.ble.currentStepIndex===i) iconClass="icon-current";
      stepsCard.appendChild(el("div", { class: "send-step" }, [
        el("div", { class: `send-step-icon ${iconClass}`, text: iconContent }),
        el("div", { class: "step-text" }, [el("div",{class:`step-label ${textClass}`,text:step.label}), el("div",{class:"step-weight",text:`${step.weight} g`})])
      ]));
    });

      const btn = el("button", { class: "btn btn-primary", style: "margin-top:16px;", text: t("recipe_send_connect") });
      if (!navigator.bluetooth) btn.disabled = true;
      btn.addEventListener("click", () => connectAndSend(recipe)); main.appendChild(btn);
    } else if (!state.ble.finished) {
      const btn = el("button", { class: "btn btn-danger", style: "margin-top:16px;", text: t("recipe_send_cancel") });
      btn.addEventListener("click", cancelRecipe); main.appendChild(btn);
    } else {
      const btn = el("button", { class: "btn btn-secondary", style: "margin-top:16px;", text: t("recipe_send_back") });
      btn.addEventListener("click", () => { disconnectBle(); state.view="client"; render(); }); main.appendChild(btn);
    }
    return main;
  }
  async function connectAndSend(recipe) {
    try {
      state.ble.error = null; state.ble.statusText = "Recherche de la balance..."; render();
      const device = await navigator.bluetooth.requestDevice({ filters: [{ name: "LumaScale" }], optionalServices: [BLE_SERVICE_UUID] });
      state.ble.device = device; device.addEventListener("gattserverdisconnected", onBleDisconnected);
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(BLE_SERVICE_UUID);
      state.ble.recipeChar = await service.getCharacteristic(BLE_RECIPE_UUID);
      state.ble.statusChar = await service.getCharacteristic(BLE_STATUS_UUID);
      state.ble.commandChar = await service.getCharacteristic(BLE_COMMAND_UUID);
      state.ble.configChar = await service.getCharacteristic(BLE_CONFIG_UUID).catch(()=>null);
      state.ble.infoChar = await service.getCharacteristic(BLE_INFO_UUID).catch(()=>null);
      await state.ble.statusChar.startNotifications();
      state.ble.statusChar.addEventListener("characteristicvaluechanged", onStatusNotification);
      const payload = recipe.steps.map(s => ({ nom: s.label, poids: s.weight, type: s.type }));
      await state.ble.recipeChar.writeValue(new TextEncoder().encode(JSON.stringify(payload)));
      state.ble.connected = true; state.ble.currentStepIndex = 0; state.ble.validatedSteps = [];
      state.ble.statusText = "Recette envoyée — en attente sur la balance"; render();
    } catch (err) { state.ble.error = tr("recipe_send_error", { msg: err.message||"erreur inconnue" }); render(); }
  }
  function onStatusNotification(event) {
    const value = new TextDecoder().decode(event.target.value);
    if (value.startsWith("etape_validee:")) { const idx=parseInt(value.split(":")[1],10); if (!state.ble.validatedSteps.includes(idx)) state.ble.validatedSteps.push(idx); state.ble.statusText=`Étape ${idx+1} validée ✓`; }
    else if (value.startsWith("etape_suivante:")) { const p=value.split(":"); state.ble.currentStepIndex=parseInt(p[1],10); state.ble.statusText=`En cours : ${p[2]||""}`; }
    else if (value==="recette_terminee") { state.ble.finished=true; state.ble.statusText="Recette terminée"; }
    else if (value==="recette_annulee") { state.ble.finished=false; state.ble.connected=false; state.ble.statusText="Recette annulée"; }
    render();
  }
  function onBleDisconnected() { stopBleInfoPolling(); if (!state.ble.finished) state.ble.statusText = "Téléphone déconnecté — la balance continue seule."; render(); }
  function cancelRecipe() { if (state.ble.commandChar) state.ble.commandChar.writeValue(new TextEncoder().encode("annuler")).catch(()=>{}); state.ble.connected=false; state.ble.statusText="Recette annulée"; render(); }
  function disconnectBle() { stopBleInfoPolling(); try { if (state.ble.device && state.ble.device.gatt.connected) state.ble.device.gatt.disconnect(); } catch(e){} }

  function renderBatteryIcon(percent, charging) {
    const p = percent === null || percent === undefined ? 0 : Math.max(0, Math.min(100, percent));
    let fillColor = "var(--green)";
    if (p < 20) fillColor = "var(--red)"; else if (p < 45) fillColor = "var(--yellow)";
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 46 24"); svg.setAttribute("width", "46"); svg.setAttribute("height", "24");
    const innerW = 36, fillW = Math.round((p / 100) * innerW);
    svg.innerHTML = `<rect x="1" y="1" width="40" height="22" rx="5" fill="none" stroke="var(--text-dim)" stroke-width="2"/><rect x="42" y="8" width="3" height="8" rx="1.5" fill="var(--text-dim)"/><rect x="4" y="4" width="${innerW}" height="16" rx="2.5" fill="var(--surface-2)"/><rect x="4" y="4" width="${fillW}" height="16" rx="2.5" fill="${fillColor}"/>` +
      (charging ? `<path d="M24 4 L16 13 H21 L18 20 L27 10 H22 Z" fill="white" stroke="${fillColor}" stroke-width="0.6"/>` : "");
    return svg;
  }

  async function connectStandalone() {
    try {
      state.ble.error = null; render();
      const device = await navigator.bluetooth.requestDevice({ filters: [{ name: "LumaScale" }], optionalServices: [BLE_SERVICE_UUID] });
      state.ble.device = device; device.addEventListener("gattserverdisconnected", onBleDisconnected);
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(BLE_SERVICE_UUID);
      state.ble.commandChar = await service.getCharacteristic(BLE_COMMAND_UUID);
      state.ble.configChar = await service.getCharacteristic(BLE_CONFIG_UUID).catch(()=>null);
      state.ble.infoChar = await service.getCharacteristic(BLE_INFO_UUID).catch(()=>null);
      await refreshBleInfo();
      state.ble.connected = true; render();
      startBleInfoPolling();
    } catch (err) { state.ble.error = "Connexion impossible : " + (err.message||"erreur inconnue"); render(); }
  }
  async function refreshBleInfo() {
    if (!state.ble.infoChar) return;
    try {
      const v = await state.ble.infoChar.readValue();
      const info = JSON.parse(new TextDecoder().decode(v));
      state.ble.serial = info.serial; state.ble.firmwareVersion = info.firmware;
      state.ble.batteryPercent = typeof info.battery === "number" ? info.battery : null;
      state.ble.charging = !!info.charging;
      state.ble.ecoMode = !!info.eco_mode;
      state.ble.wifiConfigured = !!info.wifi_configured;
      state.ble.wifiConnected = !!info.wifi_connected;
      state.ble.lastError = info.last_error || "";
      if (state.salon && !state.salon.scale_serial && info.serial) { await sb.from("salons").update({ scale_serial: info.serial }).eq("id", state.salon.id); state.salon.scale_serial = info.serial; }
    } catch(e) {}
  }
  function startBleInfoPolling() {
    stopBleInfoPolling();
    state.ble.pollTimer = setInterval(async () => {
      if (!state.ble.connected) { stopBleInfoPolling(); return; }
      await refreshBleInfo();
      if (state.view === "balance") render();
    }, 20000);
  }
  function stopBleInfoPolling() {
    if (state.ble.pollTimer) { clearInterval(state.ble.pollTimer); state.ble.pollTimer = null; }
  }
  async function sendCommand(cmd) {
    if (!state.ble.commandChar) return;
    try { await state.ble.commandChar.writeValue(new TextEncoder().encode(cmd)); }
    catch (e) { state.ble.error = "Échec de l'envoi."; render(); }
  }

  function buildStatsReportHtml(stats) {
    const salonName = (state.salon && state.salon.name) || "Salon";
    const dateStr = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    const rows = (list, unit) => list.length ? list.map((x,i) => `
      <tr><td>${i+1}</td><td>${x.label}</td><td style="text-align:right;">${unit==="×" ? x.count+" ×" : x.weight+" g"}</td></tr>
    `).join("") : `<tr><td colspan="3" style="color:#888; text-align:center; padding:16px;">Pas encore assez de données</td></tr>`;
    return `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Statistiques — ${salonName}</title>
    <style>
      body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; color: #1C1D26; max-width: 720px; margin: 40px auto; padding: 0 24px; }
      h1 { font-size: 24px; margin-bottom: 2px; }
      .meta { color: #6B6D7E; font-size: 13px; margin-bottom: 28px; }
      .kpis { display:flex; gap:16px; margin-bottom: 32px; }
      .kpi { flex:1; border:1px solid #E6E4EF; border-radius:12px; padding:16px; text-align:center; }
      .kpi .num { font-size: 28px; font-weight: 700; }
      .kpi .lbl { font-size: 12px; color: #6B6D7E; margin-top:4px; }
      h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.03em; color: #6B6D7E; border-bottom: 2px solid #8B5CF6; padding-bottom: 6px; margin-top: 32px; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      td { padding: 9px 6px; border-bottom: 1px solid #EEE; font-size: 14px; }
      td:first-child { color: #999; width: 24px; }
      .footer { margin-top: 40px; font-size: 12px; color: #999; text-align: center; }
      @media print { body { margin: 0; } }
    </style></head><body>
      <h1>Rapport statistiques — ${salonName}</h1>
      <div class="meta">Généré le ${dateStr} avec LumaScale</div>
      <div class="kpis">
        <div class="kpi"><div class="num">${stats.totalRecipes}</div><div class="lbl">RECETTES CRÉÉES</div></div>
        <div class="kpi"><div class="num">${stats.totalClients}</div><div class="lbl">CLIENTS ENREGISTRÉS</div></div>
      </div>
      <h2>Recettes les plus utilisées</h2>
      <table>${rows(stats.topRecipes, "×")}</table>
      <h2>Produits les plus utilisés (quantité totale)</h2>
      <table>${rows(stats.topProducts, "g")}</table>
      ${stats.topShade ? `<h2>Couleur la plus utilisée</h2><table><tr><td></td><td>${stats.topShade.label}</td><td style="text-align:right;">${stats.topShade.weight} g</td></tr></table>` : ""}
      <div class="footer">Le pourcentage de perte/gaspillage n'est pas encore mesurable avec le matériel actuel.</div>
    </body></html>`;
  }
  function printStatsReport(stats) {
    const win = window.open("", "_blank");
    if (!win) return;
    win.document.write(buildStatsReportHtml(stats));
    win.document.close();
    win.onload = () => win.print();
  }
  function exportStatsReport(stats) {
    const html = buildStatsReportHtml(stats);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateSlug = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `statistiques-lumascale-${dateSlug}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function loadStatsData() {
    const { data: recipes } = await sb.from("recipes").select("label, steps").eq("salon_id", state.profile.salon_id);
    const list = recipes || [];
    const recipeCounts = {};
    const productTotals = {};
    list.forEach(r => {
      recipeCounts[r.label] = (recipeCounts[r.label] || 0) + 1;
      (r.steps || []).forEach(s => {
        if (!productTotals[s.label]) productTotals[s.label] = { weight: 0, type: s.type };
        productTotals[s.label].weight += Number(s.weight) || 0;
      });
    });
    const topRecipes = Object.entries(recipeCounts).map(([label, count]) => ({ label, count })).sort((a,b) => b.count - a.count).slice(0, 5);
    const topProducts = Object.entries(productTotals).map(([label, v]) => ({ label, weight: Math.round(v.weight), type: v.type })).sort((a,b) => b.weight - a.weight).slice(0, 6);
    const colorationOnly = Object.entries(productTotals).filter(([_, v]) => v.type === "coloration").map(([label, v]) => ({ label, weight: Math.round(v.weight) }));
    const topShade = colorationOnly.sort((a,b) => b.weight - a.weight)[0] || null;
    return { totalRecipes: list.length, totalClients: state.clients.length, topRecipes, topProducts, topShade };
  }

          el("div", { style: `width:20px; height:20px; border-radius:50%; background:${vo.color}; box-shadow:0 0 0 2px var(--surface);` }),
          el("span", { text: vo.label })
        ])
      ]);
      const btns = el("div", { style: "display:flex; gap:4px;" });
      const editBtn = el("button", { class: "step-remove", text: "✏️", style: "background:none;border:none;font-size:15px;cursor:pointer;" });
      editBtn.addEventListener("click", () => openDefaultVolumeModal(vo));
      const delBtn = el("button", { class: "step-remove", text: "🗑", style: "background:none;border:none;font-size:16px;cursor:pointer;" });
      delBtn.addEventListener("click", () => {
        const usedBy = state.god.defaultTemplates.filter(t => t.language===cLang && (t.steps||[]).some(st => st.label === vo.label));
        const warning = usedBy.length ? ` ⚠️ Utilisé par ${usedBy.length} recette(s) par défaut (${usedBy.map(t=>t.label).join(", ")}) — ces recettes garderont une référence à un volume qui n'existera plus.` : "";
        confirmDialog(`Supprimer le volume par défaut "${vo.label}" ?${warning}`, async () => {
        await sb.from("default_volumes").delete().eq("id", vo.id);
        state.god.defaultVolumes = state.god.defaultVolumes.filter(x => x.id !== vo.id);
        render();
      }, "btn-danger");});
      btns.appendChild(editBtn); btns.appendChild(delBtn); row.appendChild(btns);
      dvCard.appendChild(row);
    });
    const addVolBtn = el("button", { class: "btn btn-god", style: "margin-top:12px;", text: "+ Ajouter un volume" });
    addVolBtn.addEventListener("click", () => openDefaultVolumeModal(null));
    dvCard.appendChild(addVolBtn);
    main.appendChild(dvCard);

    main.appendChild(renderTableEditorSection());

    return main;
  }

  function openDefaultShadeModal(existing) {
    openModal({
      title: existing ? "Modifier la teinte" : "Nouvelle teinte par défaut",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("label", { class: "field-label", text: "Nom (ex : 6.0 — Blond foncé)" }));
        const labelIn = el("input", { type: "text", id: "godShadeLabel" }); labelIn.value = existing ? existing.label : "";
        w.appendChild(labelIn);
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Couleur" }));
        const colorIn = el("input", { type: "color", id: "godShadeColor" }); colorIn.value = existing ? existing.color : "#8b5a30";
        w.appendChild(colorIn);
        return w;
      },
      confirmLabel: "Enregistrer",
      onConfirm: async () => {
        const label = document.getElementById("godShadeLabel").value.trim();
        const color = document.getElementById("godShadeColor").value;
        if (!label) { document.querySelector(".field-error").textContent = "Le nom est requis."; return false; }
        if (existing) {
          const { error } = await sb.from("default_shades").update({ label, color }).eq("id", existing.id);
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          existing.label = label; existing.color = color;
        } else {
          const position = state.god.defaultShades.filter(s=>s.language===state.god.contentLang).length;
          const { data, error } = await sb.from("default_shades").insert({ language: state.god.contentLang, label, color, position }).select().single();
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          state.god.defaultShades.push(data);
        }
        render();
      }
    });
  }

  function openDefaultVolumeModal(existing) {
    openModal({
      title: existing ? "Modifier le volume" : "Nouveau volume par défaut",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("label", { class: "field-label", text: "Nom (ex : 20 vol (6%))" }));
        const labelIn = el("input", { type: "text", id: "godVolLabel" }); labelIn.value = existing ? existing.label : "";
        w.appendChild(labelIn);
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Couleur" }));
        const colorIn = el("input", { type: "color", id: "godVolColor" }); colorIn.value = existing ? existing.color : "#d3e6f0";
        w.appendChild(colorIn);
        return w;
      },
      confirmLabel: "Enregistrer",
      onConfirm: async () => {
        const label = document.getElementById("godVolLabel").value.trim();
        const color = document.getElementById("godVolColor").value;
        if (!label) { document.querySelector(".field-error").textContent = "Le nom est requis."; return false; }
        if (existing) {
          const { error } = await sb.from("default_volumes").update({ label, color }).eq("id", existing.id);
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          existing.label = label; existing.color = color;
        } else {
          const position = state.god.defaultVolumes.filter(v=>v.language===state.god.contentLang).length;
          const { data, error } = await sb.from("default_volumes").insert({ language: state.god.contentLang, label, color, position }).select().single();
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          state.god.defaultVolumes.push(data);
        }
        render();
      }
    });
  }

  function openDefaultTemplateModal(existing) {
    openModal({
      title: existing ? `Modifier « ${existing.label} »` : "Nouvelle recette par défaut",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("label", { class: "field-label", text: "Nom de la recette" }));
        const labelIn = el("input", { type: "text", id: "godTplLabel" }); labelIn.value = existing ? existing.label : "";
        w.appendChild(labelIn);
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Étapes — une par ligne, format : type|nom du produit|poids en g" }));
        w.appendChild(el("div", { class: "field-hint", style: "margin-bottom:6px;", text: "Type : coloration, oxydant, soin ou autre. Le nom du produit doit correspondre exactement à une teinte/un volume du nuancier ci-dessous." }));
        const stepsText = existing ? (existing.steps||[]).map(s => `${s.type}|${s.label}|${s.weight}`).join("\n") : "coloration|6.0 — Blond foncé|50\noxydant|20 vol (6%)|50\nsoin|Soin protecteur|10";
        const stepsArea = el("textarea", { id: "godTplSteps", style: "min-height:140px;" }); stepsArea.value = stepsText;
        w.appendChild(stepsArea);
        return w;
      },
      confirmLabel: "Enregistrer",
      onConfirm: async () => {
        const label = document.getElementById("godTplLabel").value.trim();
        const rawSteps = document.getElementById("godTplSteps").value.trim();
        if (!label || !rawSteps) { document.querySelector(".field-error").textContent = "Nom et au moins une étape requis."; return false; }
        const steps = [];
        for (const line of rawSteps.split("\n").filter(l => l.trim())) {
          const parts = line.split("|").map(p => p.trim());
          if (parts.length < 3 || isNaN(parseFloat(parts[2]))) { document.querySelector(".field-error").textContent = `Ligne invalide : "${line}" — format attendu type|nom|poids`; return false; }
          steps.push({ type: parts[0], label: parts[1], weight: parseFloat(parts[2]) });
        }
        if (existing) {
          const { error } = await sb.from("default_templates").update({ label, steps }).eq("id", existing.id);
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          existing.label = label; existing.steps = steps;
        } else {
          const position = state.god.defaultTemplates.filter(t=>t.language===state.god.contentLang).length;
          const { data, error } = await sb.from("default_templates").insert({ language: state.god.contentLang, label, steps, position }).select().single();
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          state.god.defaultTemplates.push(data);
        }
        render();
      }
    });
  }

  function openSavResolveModal(request) {
    openModal({
      title: "Répondre & résoudre le ticket",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("div", { class: "field-hint", style: "margin-bottom:10px; font-style:italic;", text: `« ${request.message} »` }));
        w.appendChild(el("label", { class: "field-label", text: "Réponse envoyée au salon" }));
        const respArea = el("textarea", { id: "godSavResponse", style: "min-height:100px;", placeholder: "Explique ce qui a été fait ou la solution au problème…" });
        respArea.value = request.admin_response || "";
        w.appendChild(respArea);
        return w;
      },
      confirmLabel: "Envoyer et clôturer",
      onConfirm: async () => {
        const response = document.getElementById("godSavResponse").value.trim();
        const { error } = await sb.from("sav_requests").update({ admin_response: response || null, status: "closed", resolved_at: new Date().toISOString() }).eq("id", request.id);
        if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
        request.admin_response = response || null; request.status = "closed";
        logAdminAction("Ticket SAV résolu", (request.salons && request.salons.name) || "");
        render();
      }
    });
  }

  function openSalonEditModal(salon) {
    openModal({
      title: `Modifier « ${salon.name} »`,
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("label", { class: "field-label", text: "Nom du salon" }));
        const nameIn = el("input", { type: "text", id: "godSalonName" }); nameIn.value = salon.name || "";
        w.appendChild(nameIn);
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Numéro de série de la balance" }));
        const serialIn = el("input", { type: "text", id: "godSalonSerial" }); serialIn.value = salon.scale_serial || "";
        w.appendChild(serialIn);
        return w;
      },
      confirmLabel: "Enregistrer",
      onConfirm: async () => {
        const name = document.getElementById("godSalonName").value.trim();
        const serial = document.getElementById("godSalonSerial").value.trim();
        if (!name) { document.querySelector(".field-error").textContent = "Le nom est requis."; return false; }
        const { error } = await sb.from("salons").update({ name, scale_serial: serial || null }).eq("id", salon.id);
        if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
        salon.name = name; salon.scale_serial = serial || null;
        logAdminAction("Salon modifié", name);
        render();
      }
    });
  }

  function openFaqEditModal(existingItem) {
    openModal({
      title: existingItem ? "Modifier la question" : "Nouvelle question FAQ",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("label", { class: "field-label", text: "Question (avec emoji si tu veux)" }));
        const qInput = el("input", { type: "text", id: "faqQuestion" }); qInput.value = existingItem ? existingItem.question : "";
        w.appendChild(qInput);
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Étapes — une par ligne, format : emoji | texte" }));
        const stepsText = existingItem ? (existingItem.steps||[]).map(s => `${s.icon} | ${s.text}`).join("\n") : "";
        const stepsArea = el("textarea", { id: "faqSteps", style: "min-height:120px;" }); stepsArea.value = stepsText;
        w.appendChild(stepsArea);
        return w;
      },
      confirmLabel: "Enregistrer",
      onConfirm: async () => {
        const question = document.getElementById("faqQuestion").value.trim();
        const rawSteps = document.getElementById("faqSteps").value.trim();
        if (!question || !rawSteps) { document.querySelector(".field-error").textContent = "Question et au moins une étape requises."; return false; }
        const steps = rawSteps.split("\n").filter(l => l.trim()).map(line => {
          const parts = line.split("|");
          return { icon: (parts[0]||"💡").trim(), text: (parts.slice(1).join("|")||line).trim() };
        });
        if (existingItem) {
          const { error } = await sb.from("faq_items").update({ question, steps }).eq("id", existingItem.id);
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          existingItem.question = question; existingItem.steps = steps;
        } else {
          const { data, error } = await sb.from("faq_items").insert({ question, steps, position: state.faqItems.length + 1 }).select().single();
          if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
          state.faqItems.push(data);
        }
        render();
      }
    });
  }

  function openChangelogAddModal() {
    openModal({
      title: "Nouvelle version",
      bodyBuilder: () => {
        const w = el("div");
        w.appendChild(el("label", { class: "field-label", text: "Numéro de version" }));
        w.appendChild(el("input", { type: "text", id: "clVersion", placeholder: "Ex : 2.1.0" }));
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Date (libre)" }));
        const dateInput = el("input", { type: "text", id: "clDate", placeholder: "Ex : Octobre 2026" }); dateInput.value = new Date().getFullYear().toString();
        w.appendChild(dateInput);
        w.appendChild(el("label", { class: "field-label", style: "margin-top:12px;", text: "Changements — un par ligne" }));
        w.appendChild(el("textarea", { id: "clChanges", style: "min-height:120px;" }));
        return w;
      },
      confirmLabel: "Enregistrer",
      onConfirm: async () => {
        const version = document.getElementById("clVersion").value.trim();
        const release_date = document.getElementById("clDate").value.trim();
        const changes = document.getElementById("clChanges").value.trim().split("\n").filter(l => l.trim());
        if (!version || changes.length === 0) { document.querySelector(".field-error").textContent = "Version et au moins un changement requis."; return false; }
        const { data, error } = await sb.from("changelog_entries").insert({ version, release_date, changes }).select().single();
        if (error) { document.querySelector(".field-error").textContent = error.message; return false; }
        state.changelogEntries.unshift(data);
        render();
      }
    });
  }

  // ==========================================================================
  // 19. DÉMARRAGE
  // ==========================================================================
  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") { state.view = "login"; render(); }
    else if (event === "PASSWORD_RECOVERY") { state.view = "reset-password"; render(); }
  });

  // Effet de reflet + rebond au clic, appliqué automatiquement à tous les
  // boutons violets (.btn-primary) sans avoir à modifier chacun d'eux.
  document.addEventListener("click", (e) => {
    const btn = e.target.closest && e.target.closest(".btn-primary, .lang-pill");
    if (!btn) return;
    btn.classList.remove("btn-pop");
    void btn.offsetWidth; // force le redémarrage de l'animation si reclic rapide
    btn.classList.add("btn-pop");
    btn.addEventListener("animationend", () => btn.classList.remove("btn-pop"), { once: true });
  }, true);

  async function init() {
    render();
    const { data: { session } } = await sb.auth.getSession();
    if (session) { state.session = session; await loadIdentityAndData(); }
    else { state.view = "login"; render(); }
  }
  init();
})();
</script>
</body>
</html>
